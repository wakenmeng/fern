<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060907;
  --card: #0D120F;
  --surface: rgba(255,255,255,0.04);
  --surface-2: rgba(255,255,255,0.08);
  --line: rgba(255,255,255,0.09);
  --text: #F1F7F2;
  --muted: rgba(241,247,242,0.62);
  --faint: rgba(241,247,242,0.4);
  --fern: #52E08A;
  --fern-ink: #03140A;
  --fern-soft: rgba(82,224,138,0.12);
  --amber: #F2B84B;
  --amber-soft: rgba(242,184,75,0.12);
  --blue: #7CC0FF;
  --blue-soft: rgba(124,192,255,0.12);
  --red: #FF6F61;
  --red-soft: rgba(255,111,97,0.12);
  --violet: #C9A7FF;
  /* chart series, validated on --card with the dataviz validator (dark mode) */
  --s1: #2FA866; --s2: #3B82D9; --s3: #C2610F;
  --display: "Cormorant Garamond", Georgia, serif;
  --ui: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; overflow-x: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
#veins { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 0 24px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.small { font-size: 12.5px; }

header { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px); background: rgba(6,9,7,0.75); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; align-items: center; gap: 28px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand svg { width: 26px; height: 26px; }
.brand span { font-family: var(--display); font-variant: small-caps; letter-spacing: 0.14em; font-size: 22px; font-weight: 600; }
nav.top { display: flex; gap: 4px; }
nav.top a { text-decoration: none; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; font-size: 14px; }
nav.top a.on, nav.top a:hover { color: var(--text); background: var(--surface-2); }
nav.top .short { display: none; }
@media (max-width: 600px) { nav.top .full { display: none; } nav.top .short { display: inline; } }
.sandbox { margin-left: auto; font-size: 12px; font-weight: 600; letter-spacing: .04em; padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(242,184,75,.35); color: var(--amber); background: var(--amber-soft); white-space: nowrap; }

.btn { display: inline-block; text-decoration: none; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 14px; background: var(--surface-2); transition: transform .12s, background .12s; white-space: nowrap; }
.btn:hover { background: rgba(255,255,255,.12); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--fern); color: var(--fern-ink); }
.btn.primary:hover { background: #6BEA9C; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.flat::before { display: none; }
.c-green { color: var(--fern); background: var(--fern-soft); }
.c-blue { color: var(--blue); background: var(--blue-soft); }
.c-amber { color: var(--amber); background: var(--amber-soft); }
.c-red { color: var(--red); background: var(--red-soft); }
.c-grey { color: var(--muted); background: var(--surface-2); }
.c-violet { color: var(--violet); background: rgba(201,167,255,.13); }
.breathe { animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .45; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; }
.pad { padding: 20px 22px; }
h2.t { font-family: var(--display); font-variant: small-caps; font-weight: 600; letter-spacing: .03em; font-size: 25px; margin: 0 0 12px; line-height: 1.15; }
h3.k { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin: 18px 0 8px; }
input[type=text], input[type=number] { width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: 999px; padding: 11px 16px; color: var(--text); font: inherit; outline: none; }
input:focus { border-color: rgba(82,224,138,.5); }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 50; background: #111813; border: 1px solid var(--line); padding: 10px 18px; border-radius: 999px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.sample { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 14px; background: rgba(201,167,255,.08); border: 1px solid rgba(201,167,255,.22); color: var(--violet); font-size: 13px; margin-bottom: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface); }
.callout { padding: 12px 14px; border-radius: 14px; font-size: 13px; margin-bottom: 14px; }
.callout.amber { background: var(--amber-soft); color: var(--amber); }
.callout.green { background: var(--fern-soft); color: var(--fern); }
.callout.red { background: var(--red-soft); color: var(--red); }
.empty { padding: 26px 8px; color: var(--faint); font-size: 13px; text-align: center; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); } .g6 { grid-template-columns: repeat(6, 1fr); }
.stack > * + * { margin-top: 16px; }
/* grid children may shrink below their content, so wide tables scroll inside their card */
.with-side > *, .stack > *, .grid > *, .ep > *, .split > * { min-width: 0; }

/* landing */
.hero { text-align: center; padding: 110px 0 64px; }
.hero h1 { font-family: var(--display); font-variant: small-caps; font-weight: 500; letter-spacing: .04em; font-size: clamp(44px, 7vw, 84px); line-height: 1.02; margin: 22px 0; }
.hero h1 .accent { color: var(--fern); }
.hero p { max-width: 640px; margin: 0 auto 32px; color: var(--muted); font-size: 17px; }
.ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--fern); box-shadow: 0 0 0 4px var(--fern-soft); }
.cases { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; padding-bottom: 28px; }
.case { padding: 20px; display: flex; flex-direction: column; gap: 10px; min-height: 196px; text-decoration: none; }
.case .n { font-family: var(--mono); font-size: 12px; color: var(--fern); }
.case h3 { font-family: var(--display); font-variant: small-caps; letter-spacing: .03em; font-weight: 600; font-size: 22px; margin: 0; line-height: 1.1; }
.case p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.case .survives { font-size: 12px; color: var(--faint); border-top: 1px solid var(--line); padding-top: 10px; }
.case .survives b { color: var(--text); font-weight: 500; }
.tours { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding-bottom: 80px; }
.tour { padding: 22px; text-decoration: none; display: block; }
.tour .who { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fern); }
.tour h3 { font-family: var(--display); font-variant: small-caps; font-size: 26px; font-weight: 600; margin: 6px 0 8px; letter-spacing: .03em; }
.tour ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
footer { border-top: 1px solid var(--line); padding: 28px 0 40px; font-size: 13px; color: var(--faint); text-align: center; }

/* section layout with sidebar */
.page-title { padding: 30px 0 18px; }
.page-title h1 { font-family: var(--display); font-variant: small-caps; font-weight: 500; letter-spacing: .04em; font-size: 44px; margin: 0; line-height: 1.05; }
.page-title p { margin: 6px 0 0; color: var(--muted); }
.with-side { display: grid; grid-template-columns: 212px 1fr; gap: 26px; padding-bottom: 60px; align-items: start; }
.side-nav { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 100px); overflow-y: auto; }
.side-nav a { padding: 5px 12px !important; }
.side-nav .grp { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 12px 12px 4px; }
.side-nav a { text-decoration: none; font-size: 14px; color: var(--muted); padding: 7px 12px; border-radius: 999px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.side-nav a.on, .side-nav a:hover { background: var(--surface-2); color: var(--text); }
.side-select { display: none; width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; font: 500 14px var(--ui); appearance: auto; }
.side-select option, .side-select optgroup { background: #0D120F; color: var(--text); }
.side-nav a .badge { font-family: var(--mono); font-size: 11px; padding: 0 7px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); }

/* app view */
.rail-wrap { padding: 22px 0 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.rail { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
.step { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px 7px 8px; font-size: 13px; font-weight: 500; }
.step .num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 11px; background: var(--surface-2); color: var(--muted); }
.step.done .num { background: var(--fern); color: var(--fern-ink); }
.step.next { border-color: rgba(82,224,138,.55); box-shadow: 0 0 0 3px var(--fern-soft); }
.clock { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.clock .t { font-family: var(--mono); color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); margin: 0 0 18px; }
.hint b { color: var(--fern); font-weight: 600; }
.split { display: grid; grid-template-columns: 390px 1fr; gap: 24px; align-items: start; padding-bottom: 60px; }
.mobile-tabs { display: none; }
.phone { position: relative; border-radius: 40px; border: 1px solid rgba(255,255,255,.14); background: #0B110D; padding: 18px 18px 22px; min-height: 720px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 0 0 6px #060907; }
.statusbar { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; padding: 4px 12px 14px; color: var(--muted); }
.banner { margin: 0 4px 14px; padding: 10px 14px; border-radius: 14px; background: var(--red-soft); color: var(--red); font-size: 13px; font-weight: 500; }
.bal-label { font-size: 13px; color: var(--muted); padding: 0 6px; }
.balance { font-family: var(--display); font-weight: 500; font-size: 54px; line-height: 1.05; padding: 2px 6px 6px; font-variant-numeric: lining-nums tabular-nums; }
.balance.neg { color: var(--red); }
.subbal { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 6px 18px; font-size: 12.5px; color: var(--muted); }
.subbal span { cursor: help; border-bottom: 1px dotted var(--faint); }
.subbal b { color: var(--text); font-weight: 600; font-family: var(--mono); font-size: 12px; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 4px 20px; }
.actions .btn { padding: 12px 0; }
.act-title { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 0 6px 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 8px; border-radius: 14px; cursor: pointer; }
.item:hover, .item.sel { background: var(--surface); }
.icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 15px; flex: none; }
.item .mid { flex: 1; min-width: 0; }
.item .ttl { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .amt { font-family: var(--mono); font-size: 13px; text-align: right; }
.amt.in { color: var(--fern); }
.sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; z-index: 5; }
.sheet { width: 100%; background: #101712; border-top: 1px solid var(--line); border-radius: 26px 26px 0 0; padding: 18px 20px 24px; max-height: 88%; overflow: auto; animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet h3 { font-family: var(--display); font-variant: small-caps; font-weight: 600; font-size: 26px; letter-spacing: .03em; margin: 4px 0 14px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--surface-2); margin: 0 auto 10px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px 6px; }
.toggle { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: var(--amber-soft); border: 1px solid rgba(242,184,75,.25); margin: 6px 0 16px; cursor: pointer; font-size: 13px; }
.toggle input { accent-color: var(--amber); margin-top: 3px; }
.toggle b { color: var(--amber); }
.steps { list-style: none; margin: 8px 0 16px; padding: 0; }
.steps li { position: relative; padding: 0 0 16px 26px; font-size: 13.5px; }
.steps li::before { content: ""; position: absolute; left: 4px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--fern); }
.steps li::after { content: ""; position: absolute; left: 8px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
.steps li:last-child::after { display: none; }
.steps li.amber::before { background: var(--amber); } .steps li.red::before { background: var(--red); } .steps li.blue::before { background: var(--blue); }
.steps .when { font-size: 11.5px; color: var(--faint); }
.steps .real { font-size: 11.5px; color: var(--muted); font-style: italic; }
.hood { padding: 20px; min-height: 720px; }
.hood-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.hood-head h2 { font-family: var(--display); font-variant: small-caps; font-weight: 600; font-size: 28px; letter-spacing: .03em; margin: 0; }
.tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: 9px 14px; font-weight: 500; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--text); border-color: var(--fern); }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 64px 70px 1fr; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.tl .src { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.src.api { color: var(--blue); } .src.bank { color: var(--fern); } .src.clock { color: var(--amber); } .src.ops { color: var(--violet); }
.tl .code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.journal { border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
.journal.fresh { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { border-color: var(--fern); box-shadow: 0 0 0 3px var(--fern-soft); } }
.journal .jh { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--surface); font-size: 12.5px; flex-wrap: wrap; }
.journal .jh .eff { font-family: var(--mono); color: var(--fern); }
.taccount { display: grid; grid-template-columns: 1fr 1fr; }
.taccount > div { padding: 10px 14px; }
.taccount > div + div { border-left: 1px solid var(--line); }
.taccount .side { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: var(--faint); margin-bottom: 4px; }
.taccount .acct { font-size: 13.5px; }
.taccount .val { font-family: var(--mono); font-size: 13px; }
.check { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.check .ok { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--fern); color: var(--fern-ink); font-size: 13px; font-weight: 700; flex: none; }
.check .bad { background: var(--red); }

/* ops / eng pieces */
.who { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; background: var(--fern-soft); color: var(--fern); flex: none; }
.avatar.bot { background: rgba(201,167,255,.14); color: var(--violet); }
.kv { display: flex; justify-content: space-between; font-size: 13.5px; padding: 5px 0; }
.kv b { font-family: var(--mono); font-weight: 500; }
.approvals { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 14px; }
.approver { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.cite { display: inline-flex; align-items: center; font-family: var(--mono); font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--fern-soft); color: var(--fern); border: 0; cursor: pointer; vertical-align: 1px; }
.ai-answer { font-size: 14.5px; line-height: 1.65; }
.ai-note { font-size: 12px; color: var(--faint); margin-top: 12px; }
.tool { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--line); }
.tool .fn { font-family: var(--mono); color: var(--violet); overflow-wrap: anywhere; }
.report h4 { font-family: var(--display); font-variant: small-caps; font-size: 21px; font-weight: 600; letter-spacing: .03em; margin: 20px 0 6px; }
.report p { margin: 0 0 8px; color: var(--text); }
.stat { padding: 16px 18px; }
.stat .lbl { font-size: 12px; color: var(--muted); }
.stat .val { font-family: var(--display); font-size: 34px; font-weight: 500; line-height: 1.1; margin-top: 2px; font-variant-numeric: lining-nums tabular-nums; }
.stat .sub { font-size: 12px; color: var(--faint); }
.stat.warn .val { color: var(--amber); } .stat.good .val { color: var(--fern); }
.arch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 6px 0 10px; }
.node { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: var(--surface); font-size: 13px; position: relative; }
.node b { display: block; font-size: 14px; margin-bottom: 4px; }
.node.money { border-color: rgba(82,224,138,.5); }
.arch.flow .node:not(:last-child)::after { content: "→"; position: absolute; right: -11px; top: 50%; transform: translateY(-50%); color: var(--fern); }
.legend-line { font-size: 12.5px; color: var(--muted); }
.ep { display: grid; grid-template-columns: 330px 1fr; gap: 16px; }
.ep-list button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; background: none; border: 0; padding: 8px 10px; border-radius: 12px; font-size: 13px; }
.ep-list button:hover, .ep-list button.on { background: var(--surface-2); }
.method { font-family: var(--mono); font-size: 11px; font-weight: 600; width: 44px; flex: none; }
.method.GET { color: var(--blue); } .method.POST { color: var(--fern); }
pre.code { font-variant-ligatures: none; background: #070B08; border: 1px solid var(--line); border-radius: 14px; padding: 14px; font: 12.5px/1.55 var(--mono); color: #CFE9D7; overflow: auto; margin: 6px 0 14px; max-height: 360px; white-space: pre; }
.match { display: grid; grid-template-columns: 1fr 120px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.match .mid { text-align: center; }
.seq { width: 100%; height: auto; }

/* engineering pages */
.pager { display: flex; justify-content: space-between; gap: 12px; }
a.lnk { color: var(--fern); text-decoration: none; border-bottom: 1px solid rgba(82,224,138,.35); }
.srcref { display: inline-block; font-size: 11.5px; color: var(--muted); background: var(--surface-2); padding: 1px 8px; border-radius: 6px; }
.codefile { font-size: 11.5px; color: var(--faint); margin: 2px 0 -2px; }

<script>
// ================================================================== mock backend
// Mirrors the backend rules (src/fern/ledger.py, payments.py, column.py). Every action also emits a
// trace shaped like the OpenTelemetry spans the deployed services export.
const ACC = {
  bank:       { name: "Cash at bank", sub: "Column sandbox account", side: "D" },
  receivable: { name: "ACH debits in flight", sub: "pulled, not yet arrived", side: "D" },
  pending:    { name: "ACH credits in flight", sub: "sent, not yet left", side: "C" },
  losses:     { name: "Return losses", sub: "written off", side: "D" },
  capital:    { name: "Platform capital", sub: "pre-funds the Column account", side: "C" },
  me:         { name: "Deposit · Jordan", sub: "what we owe Jordan", side: "C" },
  alex:       { name: "Deposit · Alex", sub: "what we owe Alex", side: "C" },
};
const EXT = "External checking ••4421";
let S, seq = 0;
const rid = p => `${p}_${(++seq).toString(36).padStart(3, "0")}${Math.random().toString(36).slice(2, 6)}`;
const hex = n => Array.from({ length: n }, () => "0123456789abcdef"[Math.random() * 16 | 0]).join("");
function reset() {
  S = { raw: { bank: 0, receivable: 0, pending: 0, losses: 0, me: 0, alex: 0 }, holds: {}, restr: {},
        transfers: [], journals: [], bankTxns: [], clock: 0, writeOff: null, selected: null, done: {}, sheet: null, pane: "app",
        bankCalls: [], webhooks: [], recon: [], exceptions: [], report: null, reportTools: [],
        traces: [], trace: null, span: null, open: {}, animate: null, api: "POST /v1/withdrawals", apiResult: null, apiTrace: null };
  S.raw.capital = 0;
  // The space's Column account is pre-funded, so the bank balance never goes below zero in the demo.
  const x = { id: rid("txn"), amount: 1000000, kind: "pre-funding", tid: null, clock: 0 };
  S.bankTxns.push(x); post("platform.fund", 1000000, "bank", "capital", null, x);
}
reset();
const norm = k => ACC[k].side === "D" ? S.raw[k] : -S.raw[k];
const active = o => Object.values(o).filter(x => x.status === "active").reduce((a, x) => a + x.amount, 0);
const held = () => active(S.holds), restricted = () => active(S.restr);
const available = () => norm("me") - held() - restricted();
const fmt = m => (m < 0 ? "−" : "") + "$" + (Math.abs(m) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const T = () => `T+${S.clock}m`;
const tById = id => S.transfers.find(t => t.id === id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function ev(t, code, source, extra = {}) { t.events.push({ code, source, clock: S.clock, ...extra }); }
function post(effect, amount, debit, credit, t, txn) {
  const j = { id: rid("jrn"), effect, amount, debit, credit, tid: t && t.id, txn: txn && txn.id, clock: S.clock, fresh: true };
  S.raw[debit] += amount; S.raw[credit] -= amount; S.journals.push(j);
  if (txn) txn.journal = j.id;
  return j;
}
function bankTxn(t, amount, kind) {
  const x = { id: rid("txn"), amount, kind, tid: t ? t.id : null, clock: S.clock };
  S.bankTxns.push(x); if (t) t.bank.txns.push(x); return x;
}
function bankCall(method, path, status, ms) {
  S.bankCalls.unshift({ method, path, status, ms: ms || 120 + Math.round(Math.random() * 140), clock: S.clock });
}
function webhook(t, type) {
  const id = rid("evt");
  S.webhooks.unshift({ id, type, ref: t.bank.id, clock: S.clock });
  return id;
}
function newTransfer(kind, amount, extra = {}) {
  const t = { id: rid("trf"), kind, amount, status: "created", events: [], bank: null, clock: S.clock, ...extra };
  S.transfers.unshift(t); S.selected = t.id; return t;
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => el.innerHTML = "", 3600);
}

// ================================================================== tracing
// Service -> [display name, tier]. Tier colors are the three validated series colors.
const SVC = {
  cloudflare: ["cloudflare-worker", "ext"], alb: ["aws-alb", "fern"], api: ["fern-api", "fern"], worker: ["fern-worker", "fern"],
  redis: ["elasticache-redis", "data"], postgres: ["rds-postgres", "data"], column: ["column-bank", "ext"], plaid: ["plaid", "ext"], claude: ["claude-api", "ext"],
};
const TIER = { fern: ["Fern on AWS", "var(--s1)", "#2FA866"], data: ["Data stores", "var(--s2)", "#3B82D9"], ext: ["External", "var(--s3)", "#C2610F"] };
const tierHex = svc => TIER[SVC[svc][1]][2];
let jit = rng(42);
const J = ms => +(ms * (0.85 + jit() * 0.3)).toFixed(2);
const sp = (svc, op, d, attrs = {}, kids = [], status = "ok") => ({ svc, op, d, attrs, kids, status });
const PODS = ["fern-api-7d9c6b-x2kqp", "fern-api-7d9c6b-m8wzt"];
const BACC = "bacc_2Q8fV1kD";

function finishTrace(root, meta) {
  const spans = [];
  (function lay(n, start, depth, parent) {
    n.id = hex(8); n.start = start; n.depth = depth; n.parent = parent; spans.push(n);
    let cur = start + (n.pre ?? (n.kids.length ? 0.3 : 0));
    for (const k of n.kids) { lay(k, cur + (k.gap ?? 0.08), depth + 1, n); cur = k.start + k.dur; }
    n.dur = n.kids.length ? Math.max(n.d, cur - start + (n.post ?? 0.3)) : n.d;
  })(root, 0, 0, null);
  for (const s of spans) if (s.tx) S.open[s.id] = false;
  const focus = spans.find(s => s.status === "error") || spans.find(s => ["column", "plaid", "claude"].includes(s.svc)) || spans.find(s => s.tx) || root;
  return { id: hex(16), root, spans, total: root.dur, meta, clock: S.clock, focus: focus.id, services: [...new Set(spans.map(s => s.svc))] };
}
function record(tr, mark) {
  tr.journals = S.journals.slice(mark).map(j => ({ ...j }));
  tr.after = { balance: norm("me"), available: available() };
  S.traces.unshift(tr); if (S.traces.length > 40) S.traces.length = 40;
  S.trace = tr.id; S.span = tr.focus; S.animate = tr.id; S.pane = "trace";
  return tr;
}
// A request from outside: Cloudflare Worker -> ALB -> a fern-api pod.
function ingress(method, path, kids, meta = {}) {
  const status = meta.status ?? 201, pod = PODS[jit() < .5 ? 0 : 1];
  const handler = sp("api", `${method} /v1${path}`, 0, { "http.method": method, "http.route": `/v1${path}`, "http.status_code": status, "k8s.pod": pod, ...(meta.attrs || {}) }, kids);
  const alb = sp("alb", "forward to fern-api", 0, { "aws.region": "us-west-2", "elb.target_group": "fern-api", "elb.target": `${pod}:8000` }, [handler]);
  alb.pre = J(.5); alb.post = J(.4);
  const edge = sp("cloudflare", `${method} /apps/fern/api${path}`, 0, { "cf.colo": "SJC", "cf.route": "/apps/fern/* → AWS ALB", "origin.auth": "X-Origin-Secret header" }, [alb]);
  edge.pre = J(9); edge.post = J(9);
  return finishTrace(edge, { caller: "browser", label: `${method} /v1${path}`, status, ...meta });
}
// A scheduled job inside the cluster.
function job(name, kids, meta = {}) {
  const root = sp("worker", `job ${name}`, 0, { "k8s.pod": "fern-worker-5f8d4-qq7lz", "schedule": meta.schedule || "every 30 s", "code.function": `fern.jobs.${name}` }, kids);
  return finishTrace(root, { caller: "scheduler", label: `job ${name}`, status: "ok", ...meta });
}
const q = (op, stmt, d = .5, extra = {}) => sp("postgres", op, J(d), { "db.system": "postgresql", "db.statement": stmt, ...extra });
function tx(fn, kids, svc = "api", mod = "fern.payments") {
  const s = sp(svc, `db.tx ${fn}`, 0, { "code.function": `${mod}.${fn}`, "db.isolation": "READ COMMITTED", "db.statements": kids.length + 2 },
    [q("BEGIN", "BEGIN", .12), ...kids, q("COMMIT", "COMMIT", 1.3, { "note": "synchronous commit: the Multi-AZ standby acknowledges" })]);
  s.tx = true; return s;
}
const claim = op => q("INSERT idempotency_requests", `INSERT INTO idempotency_requests (space_id, principal, operation, key)\nVALUES ($1, $2, '${op}', $3)\nON CONFLICT DO NOTHING RETURNING status`, .6, { "db.rows": 1, "result": "new key: proceed (a replay would return the stored response)" });
const saveResp = code => q("UPDATE idempotency_requests", `UPDATE idempotency_requests\nSET status = 'done', response_code = ${code}, response_body = $1\nWHERE (space_id, principal, operation, key) = ($2, $3, $4, $5)`, .5, { "db.rows": 1, "why": "a retry with the same key replays this exact response" });
const lock = (n, what) => q("SELECT accounts FOR UPDATE", `SELECT id, raw_sum_minor FROM accounts\nWHERE id = ANY($1)   -- ${what}\nORDER BY id\nFOR UPDATE`, .6, { "db.rows": n, "lock.order": "ascending account id, so concurrent requests can't deadlock" });
const availQ = (avail, amount) => q("SELECT available", `SELECT balance\n     - SUM(holds.amount_minor)        FILTER (WHERE holds.status = 'active')\n     - SUM(restrictions.amount_minor) FILTER (WHERE restrictions.status = 'active')\n       AS available\nFROM ...   -- read after the lock`, .7, { "db.rows": 1, "available": fmt(avail), "check": `${fmt(avail)} ≥ ${fmt(amount)}: ok` });
const postJ = (effect, key, amount, txn) => [
  q("INSERT journals", `INSERT INTO journals (effect, amount_minor, dedupe_key${txn ? ", bank_transaction_id" : ""})\nVALUES ('${effect}', ${amount}, '${key}'${txn ? `, '${txn}'` : ""})\nON CONFLICT (dedupe_key) DO NOTHING\nRETURNING id`, .7, { "db.rows": 1, "ledger.effect": effect, "dedupe_key": key }),
  q("INSERT postings", `INSERT INTO postings (journal_id, account_id, amount_minor)\nVALUES ($1, $debit_account,  ${amount}),\n       ($1, $credit_account, -${amount})`, .6, { "db.rows": 2, "invariant": "a journal's postings sum to zero" }),
  q("UPDATE accounts", "UPDATE accounts SET raw_sum_minor = raw_sum_minor + $1\nWHERE id = $2   -- once per posting", .5, { "db.rows": 2 }),
];
const rateLimit = route => sp("redis", "EVALSHA token_bucket", J(.45), { "db.system": "redis", "db.statement": `EVALSHA 3f1c9a… 1 rl:{spc_7f3a}:${route} 20 1`, "result": `allowed · ${12 + (jit() * 8 | 0)} of 20 tokens left` });
const colCall = (method, path, d, attrs = {}, status = "ok") => sp("column", `${method} ${path}`, J(d), { "http.method": method, "http.url": `https://api.column.com${path}`, "peer.service": "Column (sandbox)", ...attrs }, [], status);
const lockTransfer = t => q("SELECT transfers FOR UPDATE", `SELECT * FROM transfers\nWHERE id = '${t.id}'\nFOR UPDATE`, .4, { "db.rows": 1 });
const setStatus = (t, status, extra = "") => q("UPDATE transfers", `UPDATE transfers SET status = '${status}'${extra}\nWHERE id = '${t.id}'`, .4, { "db.rows": 1 });
const insBankTxn = (x, provider = "column") => q("INSERT bank_transactions", `INSERT INTO bank_transactions (provider, provider_txn_id, amount_minor)\nVALUES ('${provider}', '${x.id}', ${x.amount})\nON CONFLICT (provider, provider_txn_id) DO NOTHING`, .7, { "db.rows": 1, "why": "re-reading the same bank state never creates a second cash movement" });
const evRow = (t, code, extra = {}) => q("INSERT transfer_events", `INSERT INTO transfer_events (transfer_id, event)\nVALUES ('${t.id}', '${code}')`, .4, extra);

function webhookTrace(tag, t, evt, type, colStatus, kids, fetchAttrs = {}, meta = {}) {
  return ingress("POST", "/webhooks/column", [
    sp("api", "verify Column-Signature", J(.12), { "algorithm": "HMAC-SHA256 over the raw body", "result": "valid" }),
    q("SELECT bank_events", `SELECT 1 FROM bank_events\nWHERE provider = 'column' AND event_id = '${evt}'`, .4, { "db.rows": 0, "result": "first delivery (a duplicate would stop here with 200)" }),
    colCall("GET", `/transfers/ach/${t.bank.id}`, 140, { "http.status_code": 200, "column.status": colStatus, ...fetchAttrs, "why": "a webhook is only a hint; the state comes from this read" }),
    tx("apply_snapshot", [...kids, q("INSERT bank_events", `INSERT INTO bank_events (provider, event_id, type)\nVALUES ('column', '${evt}', '${type}')`, .4, { "why": "inbox row written after the state is applied, in the same transaction" })]),
  ], { status: 200, caller: "column", tag, title: type, ref: t.id, ...meta });
}
const acceptKids = (t, x, respond) => [
  lockTransfer(t), insBankTxn(x), lock(3, "Jordan's deposit, credits in flight, cash at bank"),
  ...postJ("ach_credit.accept", `${t.id}:ach_credit.accept`, t.amount),
  ...postJ("ach_credit.cash_out", `${t.id}:ach_credit.cash_out`, t.amount, x.id),
  q("UPDATE holds", `UPDATE holds SET status = 'consumed'\nWHERE transfer_id = '${t.id}'`, .4, { "why": "the hold becomes a real posting" }),
  setStatus(t, "processing", `, bank_transfer_id = '${t.bank.id}'`), ...(respond ? [saveResp(201)] : []),
];

// ================================================================== flows (S1–S5)
const flows = {
  payroll(amount = 200000) {
    const mark = S.journals.length;
    const t = newTransfer("payroll", amount, { title: "Payroll · Northwind Labs" });
    t.bank = { id: rid("ach"), status: "received", txns: [] };
    bankCall("POST", "/simulate/receive-ach-credit", 200);
    const x = bankTxn(t, amount, "incoming");
    ev(t, "payroll_received", "bank");
    const evt = webhook(t, "ach.incoming_transfer.completed");
    post("ach_in.credit", amount, "bank", "me", t, x);
    t.status = "completed"; ev(t, "completed", "api");
    S.done.s1 = true;
    record(webhookTrace("S1", t, evt, "ach.incoming_transfer.completed", "COMPLETED", [
      q("INSERT transfers", `INSERT INTO transfers (id, kind, status, amount_minor, bank_transfer_id)\nVALUES ('${t.id}', 'payroll', 'completed', ${amount}, '${t.bank.id}')\nON CONFLICT (bank_transfer_id) DO NOTHING`, .6, { "db.rows": 1 }),
      insBankTxn(x), lock(2, "cash at bank, Jordan's deposit"),
      ...postJ("ach_in.credit", `${t.id}:ach_in.credit`, amount, x.id),
    ], { "column.is_incoming": "true", "column.amount": amount }, { title: "Get paid" }), mark);
  },
  pull(amount = 50000) {
    const mark = S.journals.length;
    const t = newTransfer("pull", amount, { title: `From ${EXT}` });
    ev(t, "debit_authorized", "api");
    t.bank = { id: rid("ach"), status: "initiated", txns: [] };
    bankCall("POST", "/transfers/ach", 200);
    ev(t, "bank_initiated", "bank");
    post("ach_debit.accept", amount, "receivable", "me", t);
    S.restr[t.id] = { amount, status: "active", release: null };
    ev(t, "restricted", "api");
    t.status = "processing";
    record(ingress("POST", "/pulls", [
      rateLimit("pulls"),
      tx("request_pull", [claim("pull"),
        q("SELECT linked_accounts", "SELECT plaid_account_id, routing_number, account_mask\nFROM linked_accounts WHERE customer_id = $1", .5, { "db.rows": 1 }),
        q("INSERT transfers", `INSERT INTO transfers (id, kind, status, amount_minor)\nVALUES ('${t.id}', 'pull', 'pending', ${amount})`, .6, { "db.rows": 1 }),
        evRow(t, "debit_authorized", { "detail": "authorization text v1, IP address, timestamp" })]),
      sp("plaid", "POST /accounts/balance/get", J(360), { "http.url": "https://sandbox.plaid.com/accounts/balance/get", "http.status_code": 200, "plaid.account": "checking ••4421", "plaid.available": "$3,240.18", "decision": `${fmt(amount)} is covered: low risk of an NSF return` }),
      colCall("POST", "/transfers/ach", 210, { "http.status_code": 200, "idempotency_key": t.id, "request.body": JSON.stringify({ type: "DEBIT", entry_class_code: "WEB", amount, currency_code: "USD", bank_account_id: BACC }), "column.transfer_id": t.bank.id, "column.status": "INITIATED", "column.note": "a pulled debit sits in pending_amount until settlement" }),
      tx("apply_snapshot", [lockTransfer(t), lock(2, "debits in flight, Jordan's deposit"),
        ...postJ("ach_debit.accept", `${t.id}:ach_debit.accept`, amount),
        q("INSERT restrictions", `INSERT INTO restrictions (transfer_id, amount_minor, status)\nVALUES ('${t.id}', ${amount}, 'active')`, .5, { "why": "balance goes up, available does not, until it settles and the hold period ends" }),
        setStatus(t, "processing", `, bank_transfer_id = '${t.bank.id}'`), saveResp(201)]),
    ], { tag: "S2", title: "Add money", ref: t.id }), mark);
  },
  p2p(amount) {
    const before = available();
    if (before < amount) return toast("Not enough available balance");
    const mark = S.journals.length;
    const t = newTransfer("p2p", amount, { title: "To Alex" });
    post("p2p.transfer", amount, "me", "alex", t);
    t.status = "completed"; ev(t, "completed", "api");
    S.done.s3 = true;
    record(ingress("POST", "/p2p", [
      rateLimit("p2p"),
      tx("send_p2p", [claim("p2p"), lock(2, "Jordan's deposit, Alex's deposit"), availQ(before, amount),
        q("INSERT transfers", `INSERT INTO transfers (id, kind, status, amount_minor)\nVALUES ('${t.id}', 'p2p', 'completed', ${amount})`, .5, { "db.rows": 1 }),
        ...postJ("p2p.transfer", `${t.id}:p2p.transfer`, amount), saveResp(201)]),
    ], { tag: "S3", title: "Pay Alex", ref: t.id }), mark);
  },
  withdraw(amount, drill) {
    const before = available();
    if (before < amount) return toast("Not enough available balance");
    const mark = S.journals.length;
    const t = newTransfer("withdrawal", amount, { title: `To ${EXT}` });
    S.holds[t.id] = { amount, status: "active" };
    t.status = "held"; ev(t, "hold_placed", "api");
    t.bank = { id: rid("ach"), status: "initiated", txns: [] };
    const x = bankTxn(t, -amount, "initiation");
    const first = [rateLimit("withdrawals"),
      tx("request_withdrawal", [claim("withdrawal"), lock(1, "Jordan's deposit"), availQ(before, amount),
        q("INSERT transfers", `INSERT INTO transfers (id, kind, status, amount_minor)\nVALUES ('${t.id}', 'withdrawal', 'held', ${amount})`, .5, { "db.rows": 1 }),
        q("INSERT holds", `INSERT INTO holds (transfer_id, amount_minor, status)\nVALUES ('${t.id}', ${amount}, 'active')`, .5, { "why": "reserve the money before calling the bank; no transaction stays open across the call" })])];
    const body = JSON.stringify({ type: "CREDIT", entry_class_code: "PPD", amount, currency_code: "USD", bank_account_id: BACC });
    if (drill) {
      bankCall("POST", "/transfers/ach", "timeout", 10000);
      t.status = "unknown"; t.hiddenTxn = x;
      ev(t, "bank_outcome_unknown", "bank");
      record(ingress("POST", "/withdrawals", [...first,
        colCall("POST", "/transfers/ach", 10000, { "idempotency_key": t.id, "request.body": body, "error.type": "httpx.ReadTimeout after 10 s (drill: Column created it, the reply was dropped)", "fern.outcome": "BankOutcomeUnknown", "meaning": "Column may have created the transfer: keep the hold, never pick a new key" }, "error"),
        tx("mark_unknown", [setStatus(t, "unknown"), evRow(t, "bank_outcome_unknown"), saveResp(201)]),
      ], { tag: "S4", title: "Withdraw · drill", ref: t.id, attrs: { "response.transfer.status": "unknown" },
           noLedger: "Nothing posted. The outcome is unknown, so only the hold exists until the same-key retry confirms the transfer." }), mark);
      return;
    }
    bankCall("POST", "/transfers/ach", 200);
    acceptWithdrawal(t, x);
    record(ingress("POST", "/withdrawals", [...first,
      colCall("POST", "/transfers/ach", 230, { "http.status_code": 200, "idempotency_key": t.id, "request.body": body, "column.transfer_id": t.bank.id, "column.status": "INITIATED", "column.note": "a pushed credit leaves the account at creation" }),
      tx("apply_snapshot", acceptKids(t, x, true)),
    ], { tag: "S4", title: "Withdraw", ref: t.id }), mark);
  },
  recover() {
    const list = S.transfers.filter(t => t.status === "unknown");
    if (!list.length) return toast("No transfers with an unknown outcome");
    const mark = S.journals.length;
    const kids = [q("SELECT transfers", "SELECT id, kind, amount_minor FROM transfers\nWHERE status = 'unknown'\nORDER BY created_at LIMIT 20", .7, { "db.rows": list.length, "why": "safe to run twice: same key, same Column transfer, dedupe keys" })];
    for (const t of list) {
      bankCall("POST", "/transfers/ach", 200);
      ev(t, "retry_same_key", "api");
      const x = t.hiddenTxn; acceptWithdrawal(t, x); delete t.hiddenTxn;
      kids.push(
        colCall("POST", "/transfers/ach", 190, { "http.status_code": 200, "idempotency_key": t.id, "column.transfer_id": t.bank.id, "column.status": "INITIATED", "column.replay": "existing transfer returned; nothing new created" }),
        sp("worker", "compare with original request", J(.08), { "amount": "match", "type": "CREDIT: match", "on mismatch": "BankConflict → manual_review, a person decides" }),
        tx("apply_snapshot", acceptKids(t, x, false), "worker"));
    }
    record(job("recover_unknown", kids, { tag: "S4", title: "Recovery job", ref: list[0].id }), mark);
  },
  advance() {
    S.clock += 10;
    let touched = 0;
    const released = [];
    for (const [tid, r] of Object.entries(S.restr)) {
      if (r.status === "active" && r.release !== null && r.release <= S.clock) {
        r.status = "released"; const t = tById(tid);
        ev(t, "funds_available", "clock"); t.status = "available"; S.done.s2 = true; S.selected = tid; released.push(t);
      }
    }
    if (released.length) {
      touched++;
      record(job("release_restrictions", [tx("release_restrictions", [
        q("UPDATE restrictions", "UPDATE restrictions SET status = 'released'\nWHERE status = 'active' AND release_at <= now()\nRETURNING transfer_id", .8, { "db.rows": released.length }),
        ...released.map(t => evRow(t, "funds_available")),
        ...released.map(t => setStatus(t, "available"))], "worker")],
      { tag: "S2", title: "Hold released", ref: released[0].id, noLedger: "No journal: releasing a restriction changes what's available, not the books." }), S.journals.length);
    }
    for (const t of S.transfers) {
      if (t.status !== "processing") continue;
      touched++;
      const mark = S.journals.length;
      bankCall("POST", "/simulate/transfers/ach/settle", 200);
      t.bank.status = "settled";
      let kids, meta = { title: "Settled" };
      if (t.kind === "pull") {
        const x = bankTxn(t, t.amount, "settlement");
        post("ach_debit.settle", t.amount, "bank", "receivable", t, x);
        S.restr[t.id].release = S.clock + 10;
        kids = [lockTransfer(t), insBankTxn(x), lock(2, "cash at bank, debits in flight"),
          ...postJ("ach_debit.settle", `${t.id}:ach_debit.settle`, t.amount, x.id),
          q("UPDATE restrictions", `UPDATE restrictions SET release_at = settled_at + interval '10 minutes'\nWHERE transfer_id = '${t.id}'`, .4, { "why": "demo hold period; in production it's days, set per customer" }),
          setStatus(t, "settled")];
      } else {
        kids = [lockTransfer(t), setStatus(t, "settled")];
        meta.noLedger = "Nothing to post: for a pushed credit, cash already left at initiation.";
      }
      const evt = webhook(t, "ach.outgoing_transfer.settled");
      t.status = "settled"; ev(t, "settled", "bank"); S.selected = t.id;
      record(webhookTrace(t.kind === "pull" ? "S2" : "S4", t, evt, "ach.outgoing_transfer.settled", "SETTLED", kids, {}, meta), mark);
    }
    if (!touched) toast("Clock advanced. Nothing was in flight.");
  },
  chargeback() {
    const t = S.transfers.find(t => t.kind === "pull" && ["settled", "available"].includes(t.status));
    if (!t) return toast("Run S2 and advance the clock until it settles first");
    const mark = S.journals.length;
    t.bank.status = "returned"; t.returnCode = "R10";
    const x = bankTxn(t, -t.amount, "return");
    const evt = webhook(t, "ach.outgoing_transfer.returned");
    post("ach_debit.return", t.amount, "me", "bank", t, x);
    const r = S.restr[t.id], wasActive = r.status === "active";
    if (wasActive) { r.status = "terminated"; ev(t, "restriction_ended", "api"); }
    t.status = "returned";
    ev(t, "returned", "bank");
    const neg = norm("me") < 0;
    if (neg) ev(t, "account_negative", "api");
    S.selected = t.id;
    const pj = postJ("ach_debit.return", `${t.id}:ach_debit.return`, t.amount, x.id);
    pj[0].attrs["ledger.rule"] = "only a return may take a deposit below zero";
    record(webhookTrace("S5", t, evt, "ach.outgoing_transfer.returned", "RETURNED", [
      lockTransfer(t), insBankTxn(x), lock(2, "Jordan's deposit, cash at bank"), ...pj,
      ...(wasActive ? [q("UPDATE restrictions", `UPDATE restrictions SET status = 'terminated'\nWHERE transfer_id = '${t.id}'`, .4)] : []),
      setStatus(t, "returned", ", return_code = 'R10'"),
      ...(neg ? [evRow(t, "account_negative", { "balance": fmt(norm("me")), "effect": "sending and withdrawing are frozen" })] : []),
    ], { "column.return_code": "R10 (unauthorized)", "bank.mode": "simulator: the Column sandbox can't return R10 after settlement" }, { title: "Chargeback" }), mark);
  },
  requestWriteOff() {
    const mark = S.journals.length;
    S.writeOff = { id: rid("wo"), amount: -norm("me"), status: "pending", by: "You" };
    record(ingress("POST", "/ops/write-offs", [tx("request_write_off", [lock(1, "Jordan's deposit"),
      q("INSERT write_offs", `INSERT INTO write_offs (id, customer_id, amount_minor, requested_by)\nVALUES ('${S.writeOff.id}', 'cus_jordan', ${S.writeOff.amount}, 'ops:you')`, .5, { "rule": "amount ≤ the negative balance" })])],
    { caller: "ops", tag: "S5", title: "Request write-off", ref: S.writeOff.id, noLedger: "Nothing posted until a second person approves." }), mark);
  },
  approveWriteOff() {
    const w = S.writeOff, mark = S.journals.length;
    const j = post("ach_debit.write_off", w.amount, "losses", "me", null);
    w.status = "approved"; w.journal = j.id; S.done.s5 = true;
    record(ingress("POST", `/ops/write-offs/${w.id}/approve`, [tx("approve_write_off", [
      q("SELECT write_offs FOR UPDATE", `SELECT * FROM write_offs WHERE id = '${w.id}' FOR UPDATE`, .4, { "db.rows": 1 }),
      q("UPDATE write_offs", `UPDATE write_offs SET approved_by = 'ops:second', status = 'approved'\nWHERE id = '${w.id}'\n-- CHECK (approved_by <> requested_by)`, .5, { "rule": "two-person rule, enforced by a CHECK constraint" }),
      lock(2, "return losses, Jordan's deposit"), ...postJ("ach_debit.write_off", `${w.id}:ach_debit.write_off`, w.amount)])],
    { caller: "ops", tag: "S5", title: "Approve write-off", ref: w.id, status: 200 }), mark);
  },
  injectMismatch() {
    // A bank-side transaction our books never heard about: reconciliation must catch it.
    S.bankTxns.push({ id: rid("txn"), amount: -2500, kind: "bank_adjustment", tid: null, clock: S.clock, injected: true });
    toast("Injected an unknown −$25.00 transaction at the bank. Run reconciliation.");
  },
  reconcile() {
    const mark = S.journals.length;
    const unmatched = S.bankTxns.filter(x => !x.journal);
    for (const x of unmatched) {
      if (S.exceptions.some(e => e.txn === x.id)) continue;
      const t = x.tid && tById(x.tid);
      S.exceptions.push({ id: rid("exc"), txn: x.id, amount: x.amount, status: "open", clock: S.clock,
        kind: t && t.status === "unknown" ? "In flight: waiting for the bank to confirm" : "At the bank, not in our books", auto: !!(t && t.status === "unknown") });
    }
    for (const e of S.exceptions) {
      const x = S.bankTxns.find(b => b.id === e.txn);
      if (e.status === "open" && x && x.journal) { e.status = "auto-resolved"; e.note = "Posted after the transfer was confirmed"; }
    }
    const bankBal = S.bankTxns.reduce((a, x) => a + x.amount, 0);
    S.recon.unshift({ id: rid("rec"), clock: S.clock, scanned: S.bankTxns.length, matched: S.bankTxns.length - unmatched.length,
      exceptions: S.exceptions.filter(e => e.status === "open").length, bankBal, bookBal: norm("bank") });
    record(job("reconcile", [
      colCall("GET", `/transfers/ach?bank_account_id=${BACC}`, 180, { "http.status_code": 200, "column.count": S.bankTxns.length }),
      colCall("GET", `/bank-accounts/${BACC}`, 120, { "http.status_code": 200, "column.balance": fmt(bankBal) }),
      q("SELECT bank_transactions", "SELECT provider_txn_id, journal_id FROM bank_transactions bt\nLEFT JOIN journals j ON j.bank_transaction_id = bt.id\nWHERE bt.provider = 'column'", 1.1, { "db.rows": S.bankTxns.length, "matched": S.bankTxns.length - unmatched.length, "unmatched": unmatched.length }),
      tx("record_run", [q("INSERT recon_runs", "INSERT INTO recon_runs (scanned, matched, bank_balance, book_balance)\nVALUES ($1, $2, $3, $4)", .5),
        ...(unmatched.length ? [q("INSERT recon_exceptions", "INSERT INTO recon_exceptions (run_id, provider_txn_id, kind)\nSELECT ... ON CONFLICT DO NOTHING", .5, { "db.rows": unmatched.length })] : [])], "worker", "fern.recon"),
    ], { schedule: "every 15 min", tag: "Ops", title: "Reconciliation", noLedger: "Read only: reconciliation never changes the books, it raises exceptions." }), mark);
  },
  resolveException(id) {
    const e = S.exceptions.find(e => e.id === id);
    e.status = "escalated"; e.note = "Escalated to Column with the transaction ID; held in suspense until explained";
  },
};
function acceptWithdrawal(t, x) {
  post("ach_credit.accept", t.amount, "me", "pending", t);
  S.holds[t.id].status = "consumed";
  post("ach_credit.cash_out", t.amount, "pending", "bank", t, x);
  t.status = "processing"; ev(t, "bank_initiated", "bank");
  S.done.s4 = true;
}

// ================================================================== presentation helpers

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); for (const m of [1, 2, 4, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
// Line chart: thin 2px lines, recessive grid, crosshair + tooltip, legend + direct labels, table view.
function lineChart(id, { series, labels, fmtv, height = 190, title, unit, width = 640 }) {
  const W = width, H = height, L = 46, R = series.length > 1 ? 56 : 14, Tp = 10, B = 24;
  const max = niceMax(Math.max(...series.flatMap(s => s.values)) * 1.08);
  const x = i => L + i * (W - L - R) / (labels.length - 1);
  const y = v => H - B - v / max * (H - Tp - B);
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  const step = Math.ceil(labels.length / 6);
  CHARTS[id] = { series, labels, fmtv, x, W, L, R };
  const grid = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,0.07)"/>
    <text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="rgba(241,247,242,0.45)" font-family="JetBrains Mono">${fmtv(v)}</text>`).join("");
  const xl = labels.map((l, i) => i % step === 0 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="rgba(241,247,242,0.45)" font-family="JetBrains Mono">${l}</text>` : "").join("");
  const paths = series.map(s => `<path d="${s.values.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join("");
  const ends = series.map(s => ({ name: s.name, y: y(s.values[s.values.length - 1]) + 4 })).sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + 14);
  const direct = series.length > 1 && series.length <= 4 ? ends.map(e => `<text x="${W - R + 8}" y="${e.y}" font-size="11" fill="rgba(241,247,242,0.75)">${e.name}</text>`).join("") : "";
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}</div>` : "";
  const table = `<details class="tbl"><summary>View as table</summary><table><tr><th>${unit || "t"}</th>${series.map(s => `<th class="num">${s.name}</th>`).join("")}</tr>
    ${labels.map((l, i) => `<tr><td class="mono">${l}</td>${series.map(s => `<td class="num">${fmtv(s.values[i])}</td>`).join("")}</tr>`).join("")}</table></details>`;
  return `<div class="chart-title"><b>${title}</b></div>${legend}<div class="chart" data-chart="${id}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${grid}${xl}${paths}${direct}
      <line class="xh" x1="0" x2="0" y1="${Tp}" y2="${H - B}" stroke="rgba(241,247,242,0.35)" stroke-dasharray="3 3" visibility="hidden"/>
      ${series.map((s, k) => `<circle class="dot${k}" r="4" fill="${s.color}" stroke="#0D120F" stroke-width="2" visibility="hidden"/>`).join("")}
      <rect x="${L}" y="${Tp}" width="${W - L - R}" height="${H - Tp - B}" fill="transparent" class="hit"/>
    </svg><div class="tip"></div></div>${table}`;
}
document.addEventListener("mousemove", e => {

  document.querySelectorAll(".chart").forEach(c => {
    if (rect && c.contains(rect)) return;

  if (!rect) return;

  const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * cfg.W / r.width;
  const n = cfg.labels.length, i = Math.max(0, Math.min(n - 1, Math.round((sx - cfg.L) / ((cfg.W - cfg.L - cfg.R) / (n - 1)))));
  const xh = svg.querySelector(".xh"); xh.setAttribute("x1", cfg.x(i)); xh.setAttribute("x2", cfg.x(i)); xh.setAttribute("visibility", "visible");
  cfg.series.forEach((s, k) => { const d = svg.querySelector(`.dot${k}`);
    const seg = svg.querySelectorAll("path")[k].getAttribute("d").split(/[ML]/).filter(Boolean)[i].split(",");
    d.setAttribute("cx", seg[0]); d.setAttribute("cy", seg[1]); d.setAttribute("visibility", "visible"); });

// Sparkline for table cells: one series, no axes; the exact values are in its tooltip.
function spark(values, color = "var(--s1)", unit = "") {

  const pts = values.map((v, i) => `${(i * W / (values.length - 1)).toFixed(1)},${(H - 3 - (v - min) / (max - min) * (H - 6)).toFixed(1)}`).join(" ");

function hl(code) {

// ---- service map: the nodes a trace passed through
const MAP = { caller: [62, 96], cloudflare: [190, 96], alb: [322, 96], api: [468, 96], worker: [322, 186], postgres: [468, 186], redis: [612, 186], column: [790, 56], plaid: [790, 121], claude: [790, 186] };
const MAP_SUB = { cloudflare: "Cloudflare edge", alb: "AWS ALB", api: "EKS · FastAPI", worker: "EKS · jobs", postgres: "RDS · PG 16", redis: "ElastiCache", column: "bank · ACH", plaid: "account data", claude: "AI reports" };
const MAP_EDGES = [["caller", "cloudflare"], ["cloudflare", "alb"], ["alb", "api"], ["api", "postgres"], ["api", "redis"], ["api", "column"], ["api", "plaid"], ["api", "claude"], ["worker", "postgres"], ["worker", "column"]];
const CALLER = { browser: "Browser", column: "Column webhook", ops: "Ops console", scheduler: "Scheduler" };
const HW = 58, HH = 20;
function clip([x1, y1], [x2, y2]) {
  const dx = x2 - x1, dy = y2 - y1, t = Math.min(HW / Math.abs(dx || 1e-9), HH / Math.abs(dy || 1e-9));
  return [x1 + dx * t, y1 + dy * t];
}
function edgePath(a, b) {
  if (a === "worker" && b === "column") return "M322,206 V224 H702 V56 H732"; // routed around the data stores
  const [p, q2] = [clip(MAP[a], MAP[b]), clip(MAP[b], MAP[a])];
  return `M${p[0].toFixed(1)},${p[1].toFixed(1)} L${q2[0].toFixed(1)},${q2[1].toFixed(1)}`;
}
function serviceMap(tr) {
  const used = new Set(tr ? tr.services : []), stats = {};
  const hops = [];
  if (tr) {
    const viaEdge = tr.root.svc === "cloudflare";
    if (viaEdge) { used.add("caller"); stats["caller>cloudflare"] = { n: 1 }; hops.push("caller>cloudflare"); }
    for (const s of tr.spans) {
      if (!s.parent || s.parent.svc === s.svc) continue;
      const k = `${s.parent.svc}>${s.svc}`;
      (stats[k] = stats[k] || { n: 0 }).n++;
      if (s.status === "error") stats[k].err = true;
      if (hops[hops.length - 1] !== k) hops.push(k);
    }
  }
  const unit = b => b === "postgres" ? "queries" : b === "redis" ? "cmds" : "calls";
  const edges = MAP_EDGES.map(([a, b]) => {
    const st = stats[`${a}>${b}`], on = !!st, d = edgePath(a, b);
    const col = on ? (st.err ? "#FF6F61" : tierHex(b === "caller" ? "api" : b)) : "rgba(255,255,255,0.13)";
    let label = "";
    if (on && !["cloudflare", "alb"].includes(b) && !(a === "alb")) {
      const m = d.match(/[-\d.]+/g).map(Number), f = b === "redis" ? 0.75 : 0.45, mx = a === "worker" && b === "column" ? 612 : m[0] + (m[m.length - 2] - m[0]) * f, my = a === "worker" && b === "column" ? 236 : m[1] + (m[m.length - 1] - m[1]) * f;
      const vertical = Math.abs(m[0] - m[m.length - 2]) < 2;
      const short = a === "worker" && b === "postgres"; // too short to label above the line
      label = `<text x="${vertical ? mx + 7 : mx}" y="${vertical ? my + 4 : short ? my + 34 : my - 6}" text-anchor="${vertical ? "start" : "middle"}" font-size="10.5" fill="#F1F7F2" font-family="JetBrains Mono" paint-order="stroke" stroke="#0D120F" stroke-width="4">${st.err ? "timed out" : `${st.n} ${st.n === 1 ? unit(b).replace(/s$/, "").replace("querie", "query") : unit(b)}`}</text>`;
    }
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${on ? 1.8 : 1.2}" ${on ? "" : 'stroke-dasharray="3 4"'} marker-end="url(#${on ? "am" : "ad"})"/>${label}`;
  }).join("");
  const nodes = Object.entries(MAP).map(([k, [x, y]]) => {
    if (k === "caller" && tr && !used.has("caller")) return "";
    const on = used.has(k), tierCol = k === "caller" ? "#F1F7F2" : tierHex(k);
    const name = k === "caller" ? (tr ? CALLER[tr.meta.caller] : "Browser") : SVC[k][0];
    const sub = k === "caller" ? "caller" : MAP_SUB[k];
    return `<g opacity="${!tr || on ? 1 : 0.38}"><rect x="${x - HW}" y="${y - HH}" width="${HW * 2}" height="${HH * 2}" rx="9" fill="#101713" stroke="${on ? tierCol : "rgba(255,255,255,0.16)"}" stroke-width="${on ? 1.6 : 1}"/>
      <text x="${x}" y="${y - 3}" text-anchor="middle" font-size="11" font-weight="600" fill="#F1F7F2">${name}</text>
      <text x="${x}" y="${y + 11}" text-anchor="middle" font-size="9.5" fill="rgba(241,247,242,0.55)">${sub}</text></g>`;
  }).join("");
  // Packets: one dot per hop, in the order the spans started.
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const packets = tr && S.animate === tr.id && !still ? hops.map((k, i) => {
    const [a, b] = k.split(">"); if (!MAP_EDGES.some(([x, y]) => x === a && y === b)) return "";
    const begin = (0.15 + i * 0.2).toFixed(2), col = tierHex(b === "caller" ? "api" : b);
    return `<circle r="4.5" fill="${col}" opacity="0"><animateMotion dur=".38s" begin="${begin}s" fill="freeze" path="${edgePath(a, b)}"/>
      <set attributeName="opacity" to="1" begin="${begin}s"/><set attributeName="opacity" to="0" begin="${(+begin + .38).toFixed(2)}s"/></circle>`;
  }).join("") : "";
  const group = (x, y, w, h, label) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.1)"/>

  for (const t of S.transfers.filter(t => t.status === "unknown"))
    items.push(["var(--amber)", `Withdrawal ${fmt(t.amount)}: bank outcome unknown`, "Column didn't answer. The money is held, not lost. fern-worker retries every 30 s with the same Idempotency-Key.", `<button class="btn sm primary" onclick="act('recover')">Run recovery now</button>${traceLink(t.id)}`]);
  const ret = S.transfers.find(t => t.status === "returned");
  if (norm("me") < 0 && !S.writeOff)
    items.push(["var(--red)", `Jordan is ${fmt(norm("me"))} after a returned pull (R10)`, "Sending and withdrawing are frozen. A write-off moves the loss to Return losses; cash at the bank doesn't change. It needs two people.", `<button class="btn sm primary" onclick="act('requestWriteOff')">Request write-off</button>${ret ? traceLink(ret.id) : ""}`]);
  if (S.writeOff && S.writeOff.status === "pending")
    items.push(["var(--amber)", `Write-off of ${fmt(S.writeOff.amount)} waiting for a second approver`, "Requested by you. The database rejects an approval from the same person (CHECK approved_by ≠ requested_by).", `<button class="btn sm primary" onclick="act('approveWriteOff')">Approve as second person</button>`]);
  for (const e of S.exceptions.filter(e => e.status === "open" && !e.auto))

}

function cite(j, text) { return j ? `<button class="cite" onclick="viewRef('${j.tid || ""}')">${text}</button>` : ""; }
function buildReport() {
  const by = k => S.transfers.filter(t => t.kind === k);
  const sumOf = arr => arr.reduce((a, t) => a + t.amount, 0);
  const inflow = sumOf(by("payroll")) + sumOf(by("pull").filter(t => t.status !== "returned"));
  const outflow = sumOf(by("withdrawal"));
  const unk = S.transfers.filter(t => t.events.some(e => e.code === "bank_outcome_unknown"));
  const ret = S.journals.find(j => j.effect === "ach_debit.return");
  const wo = S.journals.find(j => j.effect === "ach_debit.write_off");
  const ok = checks().every(c => c[1]);
  const exc = S.exceptions;
  S.reportTools = [
    ["get_trial_balance()", `${Object.keys(ACC).length} accounts · ${ok ? "balanced" : "UNBALANCED"}`],
    ["list_transfers(since=T+0m)", `${S.transfers.length} transfers`],
    ["list_transfer_events(code=bank_outcome_unknown)", `${unk.length} event(s)`],
    ["list_returns()", ret ? "1 return (R10)" : "none"],
    ["get_reconciliation_summary()", `${S.recon.length} run(s) · ${exc.filter(e => e.status === "open").length} open exception(s)`],
    ["get_service_metrics(window=24h)", "p95 41 ms · 5xx 0.02% (sample)"],
  ];
  const gap = S.bankTxns.reduce((a, x) => a + x.amount, 0) - norm("bank");
  const books = !ok ? "The books are <b>not balanced</b>, which needs immediate attention."
    : gap ? `The books balance internally, but cash at the bank differs from our books by <b>${fmt(gap)}</b>. See reconciliation.`
    : "The books are balanced: debits equal credits and cash matches the bank.";
  return `<h4>Summary</h4><p>${S.transfers.length} transfers moved ${fmt(inflow)} in and ${fmt(outflow)} out. ${books}</p>

}

function act(kind, arg) {
  const before = S.traces[0];
  if (kind === "s1") { if (S.done.s1) return toast("Already paid. Try the next step."); flows.payroll(); }
  else if (kind === "s2") { if (S.transfers.some(t => t.kind === "pull")) return toast("The pull already started. Advance the clock."); flows.pull(); }
  else if (kind === "s3") return sheet("send");
  else if (kind === "s4") return sheet("withdraw");
  else if (kind === "s5") flows.chargeback();
  else if (kind === "advance") flows.advance();
  else if (kind === "recover") flows.recover();
  else if (kind === "requestWriteOff") flows.requestWriteOff();
  else if (kind === "approveWriteOff") flows.approveWriteOff();
  else if (kind === "injectMismatch") flows.injectMismatch();
  else if (kind === "reconcile") flows.reconcile();
  else if (kind === "resolve") flows.resolveException(arg);
  else if (kind === "report") { S.report = buildReport(); reportTrace(); }
  else if (kind === "tryApi") { const ep = ENDPOINTS.find(e => `${e.m} /v1${e.p}` === S.api); S.apiResult = ep.run(); S.apiTrace = S.traces[0] !== before ? S.traces[0].id : null; }
  const [top] = route(), onHome = top === "" || top === "app";
  if (/^s\d$/.test(kind) && !onHome) { location.hash = "#/"; return; } // hashchange renders, keeping the animation
  if (!onHome && kind !== "tryApi" && S.traces[0] !== before) toast(`Trace recorded · <a href="#/" onclick="pickTrace('${S.traces[0].id}')">view it</a>`);
  render();
}

    g.clearRect(0, 0, W, H); g.lineWidth = devicePixelRatio; g.strokeStyle = "rgba(82,224,138,0.06)";
    for (const f of fronds) {
      let x = f.x * W, y = f.y * H, ang = f.a + (still ? 0 : Math.sin(time / 6000 + f.ph) * 0.05);
      const steps = 26, seg = (f.len * s) / steps;
      for (let i = 0; i < steps; i++) {
        const nx = x + Math.cos(ang) * seg, ny = y + Math.sin(ang) * seg;
        g.beginPath(); g.moveTo(x, y); g.lineTo(nx, ny); g.stroke();
        const leaf = seg * 2.4 * (1 - i / steps);
        for (const side of [-1, 1]) { const la = ang + side * 1.05;
          g.beginPath(); g.moveTo(nx, ny); g.quadraticCurveTo(nx + Math.cos(la) * leaf * .6, ny + Math.sin(la) * leaf * .6, nx + Math.cos(la - side * .35) * leaf, ny + Math.sin(la - side * .35) * leaf); g.stroke(); }
        x = nx; y = ny; ang += 0.045;
      }
    }
    if (!still) requestAnimationFrame(draw);
  }
  addEventListener("resize", size); size(); requestAnimationFrame(draw);
})();

render();
</script>
</body>
</html>
