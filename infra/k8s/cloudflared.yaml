# Outbound-only Cloudflare Tunnel: no load balancer, no open inbound port. `make tunnel` creates the
# tunnel and routes fern-origin.waken.dev to it; --url sends everything to the API service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: fern
spec:
  replicas: 2
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.4.0
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run", "--url", "http://fern-api.fern.svc:80"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: { name: cloudflared, key: token }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
