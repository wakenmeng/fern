# Runs bench/load.py (mounted from the fern-bench-script ConfigMap) against fern-bench.
apiVersion: batch/v1
kind: Job
metadata:
  name: fern-bench-load
  namespace: fern
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - { key: fern/bench, operator: Exists, effect: NoSchedule }
      affinity:  # on the bench nodes if there are any; away from the API copies where possible
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: fern/bench, operator: In, values: ["true"] }
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: fern-bench }
      containers:
        - name: load
          image: IMAGE
          command: ["python", "/bench/load.py", "--base", "http://fern-bench.fern.svc", "--out", "/tmp/bench.json"]
          args: []
          volumeMounts:
            - { name: script, mountPath: /bench }
          resources:
            requests: { cpu: LOAD_CPU, memory: 1Gi }
      volumes:
        - name: script
          configMap: { name: fern-bench-script }
