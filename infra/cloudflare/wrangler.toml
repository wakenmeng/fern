# Deploy: cd infra/cloudflare && npx wrangler@4 deploy
name = "fern-router"
main = "worker.js"
compatibility_date = "2026-06-01"
routes = [{ pattern = "waken.dev/apps/fern*", zone_name = "waken.dev" }]

# The static archive (make archive fills ./archive). The Worker runs first on every request and
# only reads these files in archive mode.
assets = { directory = "./archive", binding = "ASSETS", run_worker_first = true }

[vars]
MODE = "live"
ORIGIN = "https://fern-origin.waken.dev"
# One week live (2026-11-12 to 11-19, 11:00 PST); after this the Worker serves only ./archive.
LIVE_UNTIL = "2026-11-19T19:00:00Z"
