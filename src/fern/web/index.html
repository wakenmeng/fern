<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060907;
  --card: #0D120F;
  --surface: rgba(255,255,255,0.04);
  --surface-2: rgba(255,255,255,0.08);
  --line: rgba(255,255,255,0.09);
  --text: #F1F7F2;
  --muted: rgba(241,247,242,0.62);
  --faint: rgba(241,247,242,0.4);
  --fern: #52E08A;
  --fern-ink: #03140A;
  --fern-soft: rgba(82,224,138,0.12);
  --amber: #F2B84B;
  --amber-soft: rgba(242,184,75,0.12);
  --blue: #7CC0FF;
  --blue-soft: rgba(124,192,255,0.12);
  --red: #FF6F61;
  --red-soft: rgba(255,111,97,0.12);
  --violet: #C9A7FF;
  /* chart series, validated on --card with the dataviz validator (dark mode) */
  --s1: #2FA866; --s2: #3B82D9; --s3: #C2610F;
  --display: "Cormorant Garamond", Georgia, serif;
  --ui: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; overflow-x: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
#veins { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 0 24px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.small { font-size: 12.5px; }

header { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px); background: rgba(6,9,7,0.75); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; align-items: center; gap: 28px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand svg { width: 26px; height: 26px; }
.brand span { font-family: var(--display); font-variant: small-caps; letter-spacing: 0.14em; font-size: 22px; font-weight: 600; }
nav.top { display: flex; gap: 4px; }
nav.top a { text-decoration: none; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; font-size: 14px; }
nav.top a.on, nav.top a:hover { color: var(--text); background: var(--surface-2); }
nav.top .short { display: none; }
@media (max-width: 820px) { nav.top .full { display: none; } nav.top .short { display: inline; } }
.sandbox { margin-left: auto; font-size: 12px; font-weight: 600; letter-spacing: .04em; padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(242,184,75,.35); color: var(--amber); background: var(--amber-soft); white-space: nowrap; }

.btn { display: inline-block; text-decoration: none; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 14px; background: var(--surface-2); transition: transform .12s, background .12s; white-space: nowrap; }
.btn:hover { background: rgba(255,255,255,.12); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--fern); color: var(--fern-ink); }
.btn.primary:hover { background: #6BEA9C; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.flat::before { display: none; }
.c-green { color: var(--fern); background: var(--fern-soft); }
.c-blue { color: var(--blue); background: var(--blue-soft); }
.c-amber { color: var(--amber); background: var(--amber-soft); }
.c-red { color: var(--red); background: var(--red-soft); }
.c-grey { color: var(--muted); background: var(--surface-2); }
.c-violet { color: var(--violet); background: rgba(201,167,255,.13); }
.breathe { animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .45; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; }
.pad { padding: 20px 22px; }
h2.t { font-family: var(--display); font-variant: small-caps; font-weight: 600; letter-spacing: .03em; font-size: 25px; margin: 0 0 12px; line-height: 1.15; }
h3.k { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin: 18px 0 8px; }
input[type=text], input[type=number] { width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: 999px; padding: 11px 16px; color: var(--text); font: inherit; outline: none; }
input:focus { border-color: rgba(82,224,138,.5); }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 50; background: #111813; border: 1px solid var(--line); padding: 10px 18px; border-radius: 999px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.sample { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 14px; background: rgba(201,167,255,.08); border: 1px solid rgba(201,167,255,.22); color: var(--violet); font-size: 13px; margin-bottom: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface); }
.callout { padding: 12px 14px; border-radius: 14px; font-size: 13px; margin-bottom: 14px; }
.callout.amber { background: var(--amber-soft); color: var(--amber); }
.callout.green { background: var(--fern-soft); color: var(--fern); }
.callout.red { background: var(--red-soft); color: var(--red); }
.empty { padding: 26px 8px; color: var(--faint); font-size: 13px; text-align: center; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); } .g6 { grid-template-columns: repeat(6, 1fr); }
.stack > * + * { margin-top: 16px; }
/* grid children may shrink below their content, so wide tables scroll inside their card */
.with-side > *, .stack > *, .grid > *, .ep > *, .split > * { min-width: 0; }

/* landing */
.hero { text-align: center; padding: 110px 0 64px; }
.hero h1 { font-family: var(--display); font-variant: small-caps; font-weight: 500; letter-spacing: .04em; font-size: clamp(44px, 7vw, 84px); line-height: 1.02; margin: 22px 0; }
.hero h1 .accent { color: var(--fern); }
.hero p { max-width: 640px; margin: 0 auto 32px; color: var(--muted); font-size: 17px; }
.ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--fern); box-shadow: 0 0 0 4px var(--fern-soft); }
.cases { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; padding-bottom: 28px; }
.case { padding: 20px; display: flex; flex-direction: column; gap: 10px; min-height: 196px; text-decoration: none; }
.case .n { font-family: var(--mono); font-size: 12px; color: var(--fern); }
.case h3 { font-family: var(--display); font-variant: small-caps; letter-spacing: .03em; font-weight: 600; font-size: 22px; margin: 0; line-height: 1.1; }
.case p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.case .survives { font-size: 12px; color: var(--faint); border-top: 1px solid var(--line); padding-top: 10px; }
.case .survives b { color: var(--text); font-weight: 500; }
.tours { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding-bottom: 80px; }
.tour { padding: 22px; text-decoration: none; display: block; }
.tour .who { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fern); }
.tour h3 { font-family: var(--display); font-variant: small-caps; font-size: 26px; font-weight: 600; margin: 6px 0 8px; letter-spacing: .03em; }
.tour ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
footer { border-top: 1px solid var(--line); padding: 28px 0 40px; font-size: 13px; color: var(--faint); text-align: center; }

/* section layout with sidebar */
.page-title { padding: 30px 0 18px; }
.page-title h1 { font-family: var(--display); font-variant: small-caps; font-weight: 500; letter-spacing: .04em; font-size: 44px; margin: 0; line-height: 1.05; }
.page-title p { margin: 6px 0 0; color: var(--muted); }
.with-side { display: grid; grid-template-columns: 212px 1fr; gap: 26px; padding-bottom: 60px; align-items: start; }
.side-nav { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 100px); overflow-y: auto; }
.side-nav a { padding: 5px 12px !important; }
.side-nav .grp { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 12px 12px 4px; }
.side-nav a { text-decoration: none; font-size: 14px; color: var(--muted); padding: 7px 12px; border-radius: 999px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.side-nav a.on, .side-nav a:hover { background: var(--surface-2); color: var(--text); }
.side-select { display: none; width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; font: 500 14px var(--ui); appearance: auto; }
.side-select option, .side-select optgroup { background: #0D120F; color: var(--text); }
.side-nav a .badge { font-family: var(--mono); font-size: 11px; padding: 0 7px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); }

/* app view */
.stage { display: flex; align-items: center; gap: 20px; margin: 22px 0 18px; padding: 14px 16px 14px 20px; border: 1px solid rgba(82,224,138,.35); border-radius: 20px; background: var(--surface); }
.stage-meta { display: flex; flex-direction: column; gap: 8px; flex: none; min-width: 92px; font-size: 12px; color: var(--muted); }
.pips { display: flex; gap: 4px; } .pips i { width: 14px; height: 4px; border-radius: 2px; background: var(--surface-2); }
.pips i.on { background: var(--fern); } .pips i.cur { background: rgba(82,224,138,.45); }
.stage-body { flex: 1; min-width: 0; } .stage-body b { font-size: 15px; font-weight: 600; }
.stage-body p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.stage-body a { color: var(--fern); }
.split { display: grid; grid-template-columns: 390px 1fr; gap: 24px; align-items: start; padding-bottom: 60px; }
.mobile-tabs { display: none; }
.phone { position: relative; border-radius: 40px; border: 1px solid rgba(255,255,255,.14); background: #0B110D; padding: 18px 18px 22px; min-height: 720px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 0 0 6px #060907; }
.statusbar { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; padding: 4px 12px 14px; color: var(--muted); }
.banner { margin: 0 4px 14px; padding: 10px 14px; border-radius: 14px; background: var(--red-soft); color: var(--red); font-size: 13px; font-weight: 500; }
.bal-label { font-size: 13px; color: var(--muted); padding: 0 6px; }
.balance { font-family: var(--display); font-weight: 500; font-size: 54px; line-height: 1.05; padding: 2px 6px 6px; font-variant-numeric: lining-nums tabular-nums; }
.balance.neg { color: var(--red); }
.subbal { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 6px 18px; font-size: 12.5px; color: var(--muted); }
.subbal span { cursor: help; border-bottom: 1px dotted var(--faint); }
.subbal b { color: var(--text); font-weight: 600; font-family: var(--mono); font-size: 12px; }
.act-title { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 0 6px 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 8px; border-radius: 14px; cursor: pointer; }
.item:hover, .item.sel { background: var(--surface); }
.icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 15px; flex: none; }
.item .mid { flex: 1; min-width: 0; }
.item .ttl { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .amt { font-family: var(--mono); font-size: 13px; text-align: right; }
.amt.in { color: var(--fern); }
.sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; z-index: 5; }
.sheet { width: 100%; background: #101712; border-top: 1px solid var(--line); border-radius: 26px 26px 0 0; padding: 18px 20px 24px; max-height: 88%; overflow: auto; animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet h3 { font-family: var(--display); font-variant: small-caps; font-weight: 600; font-size: 26px; letter-spacing: .03em; margin: 4px 0 14px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--surface-2); margin: 0 auto 10px; }
.steps { list-style: none; margin: 8px 0 16px; padding: 0; }
.steps li { position: relative; padding: 0 0 16px 26px; font-size: 13.5px; }
.steps li::before { content: ""; position: absolute; left: 4px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--fern); }
.steps li::after { content: ""; position: absolute; left: 8px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
.steps li:last-child::after { display: none; }
.steps li.amber::before { background: var(--amber); } .steps li.red::before { background: var(--red); } .steps li.blue::before { background: var(--blue); }
.steps .when { font-size: 11.5px; color: var(--faint); }
.steps .real { font-size: 11.5px; color: var(--muted); font-style: italic; }
.hood { padding: 20px; min-height: 720px; }
.hood-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.hood-head h2 { font-family: var(--display); font-variant: small-caps; font-weight: 600; font-size: 28px; letter-spacing: .03em; margin: 0; }
.tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: 9px 14px; font-weight: 500; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--text); border-color: var(--fern); }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 64px 70px 1fr; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.tl .src { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.src.api { color: var(--blue); } .src.bank { color: var(--fern); } .src.clock { color: var(--amber); } .src.ops { color: var(--violet); }
.tl .code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.journal { border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
.journal.fresh { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { border-color: var(--fern); box-shadow: 0 0 0 3px var(--fern-soft); } }
.journal .jh { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--surface); font-size: 12.5px; flex-wrap: wrap; }
.journal .jh .eff { font-family: var(--mono); color: var(--fern); }
.taccount { display: grid; grid-template-columns: 1fr 1fr; }
.taccount > div { padding: 10px 14px; }
.taccount > div + div { border-left: 1px solid var(--line); }
.taccount .side { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: var(--faint); margin-bottom: 4px; }
.taccount .acct { font-size: 13.5px; }
.taccount .val { font-family: var(--mono); font-size: 13px; }
.check { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.check .ok { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--fern); color: var(--fern-ink); font-size: 13px; font-weight: 700; flex: none; }
.check .bad { background: var(--red); }

/* ops / eng pieces */
.who { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; background: var(--fern-soft); color: var(--fern); flex: none; }
.avatar.bot { background: rgba(201,167,255,.14); color: var(--violet); }
.kv { display: flex; justify-content: space-between; font-size: 13.5px; padding: 5px 0; }
.kv b { font-family: var(--mono); font-weight: 500; }
.approvals { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 14px; }
.approver { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.cite { display: inline-flex; align-items: center; font-family: var(--mono); font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--fern-soft); color: var(--fern); border: 0; cursor: pointer; vertical-align: 1px; }
.ai-answer { font-size: 14.5px; line-height: 1.65; }
.ai-note { font-size: 12px; color: var(--faint); margin-top: 12px; }
.tool { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--line); }
.tool .fn { font-family: var(--mono); color: var(--violet); overflow-wrap: anywhere; }
.report h4 { font-family: var(--display); font-variant: small-caps; font-size: 21px; font-weight: 600; letter-spacing: .03em; margin: 20px 0 6px; }
.report p { margin: 0 0 8px; color: var(--text); }
.stat { padding: 16px 18px; }
.stat .lbl { font-size: 12px; color: var(--muted); }
.stat .val { font-family: var(--display); font-size: 34px; font-weight: 500; line-height: 1.1; margin-top: 2px; font-variant-numeric: lining-nums tabular-nums; }
.stat .sub { font-size: 12px; color: var(--faint); }
.stat.warn .val { color: var(--amber); } .stat.good .val { color: var(--fern); }
.arch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 6px 0 10px; }
.node { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: var(--surface); font-size: 13px; position: relative; }
.node b { display: block; font-size: 14px; margin-bottom: 4px; }
.node.money { border-color: rgba(82,224,138,.5); }
.arch.flow .node:not(:last-child)::after { content: "→"; position: absolute; right: -11px; top: 50%; transform: translateY(-50%); color: var(--fern); }
.legend-line { font-size: 12.5px; color: var(--muted); }
.ep { display: grid; grid-template-columns: 330px 1fr; gap: 16px; }
.ep-list button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; background: none; border: 0; padding: 8px 10px; border-radius: 12px; font-size: 13px; }
.ep-list button:hover, .ep-list button.on { background: var(--surface-2); }
.method { font-family: var(--mono); font-size: 11px; font-weight: 600; width: 44px; flex: none; }
.method.GET { color: var(--blue); } .method.POST { color: var(--fern); }
pre.code { font-variant-ligatures: none; background: #070B08; border: 1px solid var(--line); border-radius: 14px; padding: 14px; font: 12.5px/1.55 var(--mono); color: #CFE9D7; overflow: auto; margin: 6px 0 14px; max-height: 360px; white-space: pre; }
.match { display: grid; grid-template-columns: 1fr 120px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.match .mid { text-align: center; }
.seq { width: 100%; height: auto; }

/* engineering pages */
.pager { display: flex; justify-content: space-between; gap: 12px; }
a.lnk { color: var(--fern); text-decoration: none; border-bottom: 1px solid rgba(82,224,138,.35); }
.srcref { display: inline-block; font-size: 11.5px; color: var(--muted); background: var(--surface-2); padding: 1px 8px; border-radius: 6px; }
.codefile { font-size: 11.5px; color: var(--faint); margin: 2px 0 -2px; }
.hc { color: rgba(241,247,242,.42); } .hs { color: #A8E6BD; } .hk { color: #C9A7FF; }
.states { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.states .arrow { color: var(--faint); font-size: 13px; white-space: pre; }
.archive-note { background: var(--amber-soft); border-bottom: 1px solid rgba(242,184,75,.25); color: var(--muted); font-size: 13px; padding: 9px 0; }
.archive-note b { color: var(--amber); font-weight: 600; }
.anno { border-left: 2px solid var(--fern); padding: 4px 12px; font-size: 13.5px; color: var(--muted); }
details.adr { border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; background: var(--surface); }
details.adr summary { cursor: pointer; font-weight: 600; list-style-position: outside; }
details.adr .adr-body { margin-top: 10px; font-size: 14px; }

<script>
// Fern demo UI. Talks to the Fern API on the same origin with relative paths, so it works at
// http://localhost:8000/ and behind the Cloudflare Worker at https://waken.dev/apps/fern/.
// Every state-changing request returns X-Trace-Id; the trace panel shows GET traces/{id}.

// ================================================================== API client
const BASE = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode */ } },
};
const newKey = () => (crypto.randomUUID ? crypto.randomUUID() : `k-${Date.now()}-${Math.random().toString(36).slice(2)}`);
let SESSION = null;

// ================================================================== record and archive
// ?record=1 keeps every API call, in order, in window.__fernRecording (tokens stripped); the archive
// run saves it as archive.json. When archive.json is served (the static archive after the live
// system is shut down), the page replays that recording instead of calling the API. Static files
// always come from the network.
const STATIC = new Set(["bench.json", "archive.json"]);
const RECORD = new URLSearchParams(location.search).has("record");
if (RECORD) window.__fernRecording = { recorded_at: new Date().toISOString(), calls: [] };
let ARCHIVE = null;  // { recorded_at, calls, cursor }: cursor is the index after the last replayed write
const stripTokens = v => Array.isArray(v) ? v.map(stripTokens)
  : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).filter(([k]) => k !== "token").map(([k, x]) => [k, stripTokens(x)])) : v;
async function loadArchive() {
  if (RECORD) return;
  try {
    const r = await fetch(BASE + "archive.json", { cache: "no-cache" });
    if (!r.ok) return;  // the live API answers 404
    const d = await r.json();
    if (Array.isArray(d.calls) && d.calls.length) ARCHIVE = { ...d, cursor: 0 };
  } catch { /* not an archive */ }
}
const ARCHIVED = { status: 410, data: { error: "Archived", message: "Not available in the archive: this wasn't part of the recorded run." }, archived: true };
// A write takes the next recorded call with the same method and path. A read gets the state as of
// now: the latest recorded response before the next write still to replay, else the first after it.
async function replay(method, path) {
  const calls = ARCHIVE.calls, same = c => c.method === method && c.path === path;
  let hit = -1;
  if (method !== "GET") {
    hit = calls.findIndex((c, i) => i >= ARCHIVE.cursor && same(c));
    if (hit >= 0) ARCHIVE.cursor = hit + 1;
    await new Promise(r => setTimeout(r, 250));  // long enough to see the busy state
  } else {
    let next = calls.findIndex((c, i) => i >= ARCHIVE.cursor && c.method !== "GET");
    if (next < 0) next = calls.length;
    for (let i = next - 1; i >= 0 && hit < 0; i--) if (same(calls[i])) hit = i;
    if (hit < 0) hit = calls.findIndex((c, i) => i >= next && same(c));
  }
  if (hit < 0) return structuredClone(ARCHIVED);
  const c = calls[hit];
  return { status: c.status, data: structuredClone(c.response), traceId: c.trace_id || null };
}

async function call(method, path, body, { idem } = {}) {
  if (ARCHIVE && !STATIC.has(path)) return replay(method, path);
  const headers = {};
  if (SESSION) headers.Authorization = `Bearer ${SESSION.token}`;
  if (idem) headers["Idempotency-Key"] = idem;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  let r;
  try { r = await fetch(BASE + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) }); }
  catch (e) { return { status: 0, data: { error: "NetworkError", message: String(e) } }; }
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text.slice(0, 500) }; }
  const out = { status: r.status, data, traceId: r.headers.get("X-Trace-Id") };
  if (RECORD && !STATIC.has(path)) {
    const rec = window.__fernRecording.calls;
    rec.push({ method, path, body: body === undefined ? null : stripTokens(body), status: out.status, response: stripTokens(data), trace_id: out.traceId });
    document.querySelector(".sandbox").textContent = `Recording · ${rec.length} calls`;
  }
  return out;
}
const errText = r => { const d = r.data || {}; return d.message || (typeof d.detail === "string" ? d.detail : d.detail ? JSON.stringify(d.detail) : d.error) || `HTTP ${r.status}`; };

// ================================================================== state
const S = {
  me: null, transfers: [], tb: null, ops: null, report: null, status: null, join: null, fatal: null,
  traces: [], trace: null, span: null, open: {}, animate: null, refs: {},
  sheet: null, detail: null, pane: "app", busy: null,
  api: "POST /withdrawals", apiResult: null, apiTrace: null,
};
const EXT_ACCT = "External checking ••4421";
const fmt = m => (m < 0 ? "−" : "") + "$" + (Math.abs(m) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const me = () => S.me && S.me.customers.find(c => c.kind === "primary");
const alex = () => S.me && S.me.customers.find(c => c.kind === "npc");
const isSim = () => S.me && S.me.bank === "sim";
const bankName = () => isSim() ? "bank simulator" : "Column sandbox";
function toast(msg) {
  const el = document.getElementById("toast");
  el.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => el.innerHTML = "", 4200);
}

async function boot() {
  // Recording and the archive always start from a fresh space, so the recording begins with POST /spaces.
  SESSION = ARCHIVE || RECORD ? null : store.get("fern.session");
  if (SESSION && (await call("GET", "me")).status !== 200) SESSION = null;
  if (!SESSION) {
    const r = await call("POST", "spaces");
    if (r.status === 201) { setSession(r.data); if (r.traceId) await loadTrace(r.traceId, {}, false); }
    else if (r.status === 503) { S.join = ((await call("GET", "spaces")).data || {}).spaces || []; render(); return; }
    else { S.fatal = `Could not open a demo space: ${errText(r)}`; render(); return; }
  }
  await refresh();
  await loadRecentTraces();
  render();
}
function showArchive() {
  const when = new Date(ARCHIVE.recorded_at).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  document.querySelector(".sandbox").textContent = "Archive · No real money";
  const note = document.getElementById("archive-note");
  note.innerHTML = `<div class="wrap"><b>Archive</b> · recorded from the live system on ${esc(when)}. The buttons replay that run; Column, Plaid and OpenAI are not called.</div>`;
  note.hidden = false;
}
function setSession(d) { SESSION = { token: d.token, space_id: d.space_id }; if (!ARCHIVE) store.set("fern.session", SESSION); S.join = null; }
async function joinSpace(id) {
  const r = await call("POST", `spaces/${id}/join`);
  if (r.status !== 200) return toast(errText(r));
  setSession(r.data); await refresh(); await loadRecentTraces(); render();
}
async function newSpace() {
  if (ARCHIVE) ARCHIVE.cursor = 0;  // start over replays the recording from the top
  else store.set("fern.session", null);
  SESSION = null;
  Object.assign(S, { me: null, transfers: [], traces: [], trace: null, span: null, ops: null, report: null, refs: {} });
  render(); await boot();
}
async function refresh() {
  const [m, t, tb] = await Promise.all([call("GET", "me"), call("GET", "transfers"), call("GET", "ledger/trial-balance")]);
  if (m.status === 200) S.me = m.data;
  if (t.status === 200) S.transfers = t.data.transfers;
  if (tb.status === 200) S.tb = tb.data;
  const [top] = route();
  if (top === "ops") await refreshOps();
}
async function refreshOps() {
  const [o, rep] = await Promise.all([call("GET", "ops/summary"), S.report ? null : call("GET", "ops/reports/latest")]);
  if (o.status === 200) S.ops = o.data;
  if (rep && rep.status === 200) S.report = rep.data;
}
async function refreshStatus() {
  const r = await call("GET", "status");
  if (r.status === 200) S.status = r.data;
}

// Run one request from a button: busy state, the call, its trace, fresh balances.
async function run(meta, method, path, body, opts = {}) {
  if (S.busy) return null;
  S.busy = meta.title; render();
  const r = await call(method, path, body, opts);
  const ref = meta.ref || (r.data && r.data.id);
  if (ref && r.traceId) S.refs[ref] = r.traceId;
  if (r.traceId) await loadTrace(r.traceId, { ...meta, ref, http: r.status }, true);
  await refresh();
  if (S.trace === r.traceId) { const tr = S.traces.find(x => x.id === r.traceId); if (tr) tr.after = afterNow(); }
  S.busy = null;
  if (r.status >= 400 || r.status === 0) toast(`${r.status || "network"} · ${esc(errText(r))}`);
  return r;
}

function buildTrace(raw, meta) {
  const by = {};
  const spans = raw.spans.map(s => ({ id: s.id, parentId: s.parent_id, svc: s.service, op: s.name, start: s.start_us / 1000,
    dur: Math.max(s.duration_us / 1000, 0.001), status: s.status, attrs: s.attrs || {}, kids: [] }));
  spans.forEach(s => by[s.id] = s);
  spans.forEach(s => { s.parent = s.parentId ? by[s.parentId] : null; if (s.parent) s.parent.kids.push(s); });
  const root = spans.find(s => !s.parent) || spans[0], ordered = [];
  (function walk(n, d) { n.depth = d; ordered.push(n); n.kids.sort((a, b) => a.start - b.start).forEach(k => walk(k, d + 1)); })(root, 0);
  for (const s of ordered) { s.tx = s.op.startsWith("db.tx "); if (s.tx && !(s.id in S.open)) S.open[s.id] = false; }
  const focus = ordered.find(s => s.status === "error" && s !== root && !s.kids.some(k => k.status === "error"))
    || ordered.find(s => OUTBOUND.has(s.svc)) || ordered.find(s => s.tx) || root;
  const [tag, title] = TAGS[raw.name] || ["API", raw.name];
  const edge = !!(root.attrs["cf.ray"]);
  const services = [...new Set(ordered.map(s => NODE(s.svc)))];
  if (edge) services.push("cloudflare", "tunnel");
  return { id: raw.trace_id, root, spans: ordered, total: Math.max(raw.duration_us / 1000, 0.01), status: raw.status,
    meta: { tag, title, label: raw.name, http: root.attrs["http.status_code"], ...meta }, edge, focus: focus.id, services,
    journals: ordered.filter(s => s.attrs["ledger.effect"]), started: raw.started_at, after: null };
}
async function loadTrace(id, meta, select) {
  const r = await call("GET", `traces/${id}`);
  if (r.status !== 200) return null;
  const tr = buildTrace(r.data, meta);
  S.traces = [tr, ...S.traces.filter(x => x.id !== id)].slice(0, 30);
  if (select) { S.trace = tr.id; S.span = tr.focus; S.animate = tr.id; S.pane = "trace"; }
  return tr;
}
async function loadRecentTraces() {
  const r = await call("GET", "traces?limit=10");
  if (r.status !== 200) return;
  const have = new Set(S.traces.map(t => t.id));
  const missing = r.data.traces.filter(t => !have.has(t.trace_id));
  const full = await Promise.all(missing.map(t => call("GET", `traces/${t.trace_id}`)));
  for (const f of full) if (f.status === 200) S.traces.push(buildTrace(f.data, {}));
  S.traces.sort((a, b) => (b.started || "").localeCompare(a.started || ""));

}

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); for (const m of [1, 2, 4, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
// Line chart: thin 2px lines, recessive grid, crosshair + tooltip, legend + direct labels, table view.
function lineChart(id, { series, labels, fmtv, height = 190, title, unit, width = 640 }) {
  const W = width, H = height, L = 46, R = series.length > 1 ? 56 : 14, Tp = 10, B = 24;
  const max = niceMax(Math.max(...series.flatMap(s => s.values)) * 1.08);
  const x = i => L + i * (W - L - R) / Math.max(1, labels.length - 1);
  const y = v => H - B - v / max * (H - Tp - B);
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  const step = Math.ceil(labels.length / 6);
  CHARTS[id] = { series, labels, fmtv, x, W, L, R };
  const grid = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,0.07)"/>
    <text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="rgba(241,247,242,0.45)" font-family="JetBrains Mono">${fmtv(v)}</text>`).join("");
  const xl = labels.map((l, i) => i % step === 0 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="rgba(241,247,242,0.45)" font-family="JetBrains Mono">${l}</text>` : "").join("");
  const paths = series.map(s => `<path d="${s.values.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join("");
  const ends = series.map(s => ({ name: s.name, y: y(s.values[s.values.length - 1]) + 4 })).sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + 14);
  const direct = series.length > 1 && series.length <= 4 ? ends.map(e => `<text x="${W - R + 8}" y="${e.y}" font-size="11" fill="rgba(241,247,242,0.75)">${e.name}</text>`).join("") : "";
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}</div>` : "";
  const table = `<details class="tbl"><summary>View as table</summary><table><tr><th>${unit || "t"}</th>${series.map(s => `<th class="num">${s.name}</th>`).join("")}</tr>
    ${labels.map((l, i) => `<tr><td class="mono">${l}</td>${series.map(s => `<td class="num">${fmtv(s.values[i])}</td>`).join("")}</tr>`).join("")}</table></details>`;
  return `<div class="chart-title"><b>${title}</b></div>${legend}<div class="chart" data-chart="${id}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${grid}${xl}${paths}${direct}
      <line class="xh" x1="0" x2="0" y1="${Tp}" y2="${H - B}" stroke="rgba(241,247,242,0.35)" stroke-dasharray="3 3" visibility="hidden"/>
      ${series.map((s, k) => `<circle class="dot${k}" r="4" fill="${s.color}" stroke="#0D120F" stroke-width="2" visibility="hidden"/>`).join("")}
      <rect x="${L}" y="${Tp}" width="${W - L - R}" height="${H - Tp - B}" fill="transparent" class="hit"/>
    </svg><div class="tip"></div></div>${table}`;
}
document.addEventListener("mousemove", e => {
  const rect = e.target.closest && e.target.closest(".chart rect.hit");
  document.querySelectorAll(".chart").forEach(c => {

  if (!rect) return;
  const box = rect.closest(".chart"), cfg = CHARTS[box.dataset.chart], svg = box.querySelector("svg");
  const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * cfg.W / r.width;
  const n = cfg.labels.length, i = Math.max(0, Math.min(n - 1, Math.round((sx - cfg.L) / ((cfg.W - cfg.L - cfg.R) / Math.max(1, n - 1)))));
  const xh = svg.querySelector(".xh"); xh.setAttribute("x1", cfg.x(i)); xh.setAttribute("x2", cfg.x(i)); xh.setAttribute("visibility", "visible");
  cfg.series.forEach((s, k) => { const d = svg.querySelector(`.dot${k}`);
    const seg = svg.querySelectorAll("path")[k].getAttribute("d").split(/[ML]/).filter(Boolean)[i].split(",");
    d.setAttribute("cx", seg[0]); d.setAttribute("cy", seg[1]); d.setAttribute("visibility", "visible"); });
  const tip = box.querySelector(".tip");
  tip.innerHTML = `<div class="mono faint" style="margin-bottom:4px">${cfg.labels[i]}</div>` + cfg.series.map(s => `<div class="row"><span><i style="background:${s.color}"></i> ${s.name}</span><b class="mono">${cfg.fmtv(s.values[i])}</b></div>`).join("");
  tip.style.display = "block";
  const px = cfg.x(i) / cfg.W * r.width;

// ---- service map: the nodes a trace passed through
const MAP = { caller: [62, 96], cloudflare: [190, 96], tunnel: [322, 96], api: [468, 96], postgres: [400, 186], redis: [540, 186], column: [790, 56], plaid: [790, 121], openai: [790, 186] };
const MAP_SUB = { cloudflare: "Worker · edge", tunnel: "Tunnel · in EKS", api: "EKS · FastAPI", postgres: "RDS · PG 16", redis: "ElastiCache", column: "bank · ACH", plaid: "account data", openai: "AI reports" };
const MAP_EDGES = [["caller", "cloudflare"], ["cloudflare", "tunnel"], ["tunnel", "api"], ["api", "postgres"], ["api", "redis"], ["api", "column"], ["api", "plaid"], ["api", "openai"]];
const HW = 58, HH = 20;
function clip([x1, y1], [x2, y2]) {
  const dx = x2 - x1, dy = y2 - y1, t = Math.min(HW / Math.abs(dx || 1e-9), HH / Math.abs(dy || 1e-9));

}
function edgePath(a, b) {

  const [p, q2] = [clip(MAP[a], MAP[b]), clip(MAP[b], MAP[a])];

}
function serviceMap(tr) {

    used.add("caller");
    if (tr.edge) for (const k of ["caller>cloudflare", "cloudflare>tunnel", "tunnel>api"]) { stats[k] = { n: 1 }; hops.push(k); }
    else { edges0.push(["caller", "api"]); stats["caller>api"] = { n: 1 }; hops.push("caller>api"); }
    for (const s of tr.spans) {
      if (!s.parent) continue;
      const a = NODE(s.parent.svc), b = NODE(s.svc);
      if (a === b) continue;
      const k = `${a}>${b}`;
      (stats[k] = stats[k] || { n: 0 }).n++;

      if (hops[hops.length - 1] !== k) hops.push(k);

  const edges = edges0.map(([a, b]) => {
    const st = stats[`${a}>${b}`], on = !!st, d = edgePath(a, b);
    const col = on ? (st.err ? "#FF6F61" : tierHex(b === "api" ? "api" : b)) : "rgba(255,255,255,0.13)";
    let label = "";

      const mx = m[0] + (m[m.length - 2] - m[0]) * f, my = m[1] + (m[m.length - 1] - m[1]) * f;
      const below = b === "postgres" || b === "redis";
      label = `<text x="${below ? mx + (b === "postgres" ? -8 : 8) : mx}" y="${below ? my + 4 : my - 6}" text-anchor="${below ? (b === "postgres" ? "end" : "start") : "middle"}" font-size="10.5" fill="#F1F7F2" font-family="JetBrains Mono" paint-order="stroke" stroke="#0D120F" stroke-width="4">${st.err ? esc(/Unknown|Timeout/.test(st.err) ? "no reply" : "error") : `${st.n} ${unit(b, st.n)}`}</text>`;
    }
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${on ? 1.8 : 1.2}" ${on ? "" : 'stroke-dasharray="3 4"'} marker-end="url(#${on ? "am" : "ad"})"/>${label}`;
  }).join("");
  const sim = tr ? tr.spans.some(s => s.svc === "bank-sim") : isSim();
  const nodes = Object.entries(MAP).map(([k, [x, y]]) => {
    const on = used.has(k), tierCol = k === "caller" ? "#F1F7F2" : tierHex(k);
    const name = k === "caller" ? "Browser" : k === "column" && sim ? "bank-sim" : svcName(k);
    const sub = k === "caller" ? (tr && !tr.edge ? "direct (local)" : "caller") : k === "column" && sim ? "Column's API, in-process" : MAP_SUB[k];
    return `<g opacity="${!tr || on ? 1 : 0.38}"><rect x="${x - HW}" y="${y - HH}" width="${HW * 2}" height="${HH * 2}" rx="9" fill="#101713" stroke="${on ? tierCol : "rgba(255,255,255,0.16)"}" stroke-width="${on ? 1.6 : 1}"/>
      <text x="${x}" y="${y - 3}" text-anchor="middle" font-size="11" font-weight="600" fill="#F1F7F2">${name}</text>
      <text x="${x}" y="${y + 11}" text-anchor="middle" font-size="9.5" fill="rgba(241,247,242,0.55)">${sub}</text></g>`;
  }).join("");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const packets = tr && S.animate === tr.id && !still ? hops.map((k, i) => {
    const [a, b] = k.split(">"); if (!edges0.some(([x, y]) => x === a && y === b)) return "";

  }).join("") : "";

  return `<svg class="svcmap" viewBox="0 0 860 240" role="img" aria-label="Services this request passed through">
    <defs>${["am", "ad"].map(id => `<marker id="${id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="${id === "am" ? "#F1F7F2" : "rgba(255,255,255,0.25)"}" opacity="${id === "am" ? 0.7 : 1}"/></marker>`).join("")}</defs>
    ${group(126, 52, 128, 82, "CLOUDFLARE")}${group(258, 52, 352, 166, "AWS · US-WEST-2 · VPC")}${group(722, 14, 136, 202, "THIRD-PARTY APIS")}

function waterfall(tr) {

  const rows = tr.spans.filter(s => !hidden(s));
  const raw = tr.total / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), m = [1, 2, 2.5, 5, 10].find(m => m * p >= raw), stepMs = m * p;
  const ticks = []; for (let t = 0; t < tr.total * 0.98; t += stepMs) ticks.push(t);

  const count = s => { let n = 0; (function c(x) { for (const k of x.kids) { if (k.svc === "postgres") n++; c(k); } })(s); return n; };

}

      <div class="card pad">${lineChart("bt-rps", { title: "Throughput (req/s)", labels: lab, unit: "elapsed", height: 220, width: 360, fmtv: v => v.toFixed(0), series: [{ name: "req/s", color: "var(--s1)", values: pts.map(p => p.rps) }] })}</div>
      <div class="card pad">${lineChart("bt-lat", { title: "Latency (ms)", labels: lab, unit: "elapsed", height: 220, width: 360, fmtv: v => v.toFixed(0), series: [{ name: "p50", color: "var(--s1)", values: pts.map(p => p.p50) }, { name: "p95", color: "var(--s2)", values: pts.map(p => p.p95) }] })}</div></div>` : ""}
    <div class="grid g2">
      <div class="card pad"><h2 class="t">By endpoint</h2><table><tr><th>Endpoint</th><th class="num">Requests</th><th class="num">p50</th><th class="num">p95</th><th class="num">p99</th></tr>
        ${(b.endpoints || []).map(e => `<tr><td class="mono small">${esc(e.name)}</td><td class="num">${n(e.count)}</td><td class="num">${msf(e.p50)}</td><td class="num">${msf(e.p95)}</td><td class="num">${msf(e.p99)}</td></tr>`).join("")}</table>
        <p class="faint small" style="margin:10px 0 0">Milliseconds over the whole run. Overall p50 ${msf(h.p50_ms)} · p95 ${msf(h.p95_ms)} · p99 ${msf(h.p99_ms)}. Status codes: ${codes.map(([c, k]) => `${c} × ${n(k)}`).join(", ")}.</p></div>
      <div class="card pad"><h2 class="t">Money after the run</h2><p class="muted small" style="margin:0 0 6px">After the load stops, every space is checked against a model of the requests it accepted.</p>
        ${checks.map(([t, v, d, ok]) => `<div class="check"><span class="ok ${ok ? "" : "bad"}">${ok ? "✓" : "✕"}</span><div style="flex:1"><div>${t}</div><div class="faint small">${d}</div></div><b class="mono">${v}</b></div>`).join("")}</div></div>
    <div class="card pad"><h2 class="t">Method</h2><table>
      ${[["Where", me.where], ["Bank", me.bank], ["Database", me.database], ["Load", stages], ["Think time", me.think_time_s ? `${me.think_time_s[0]}–${me.think_time_s[1]} s between requests` : ""], ["Mix", mix], ["API replicas", me.api_replicas], ["Load generator", me.load_processes ? `${me.load_processes} processes` : ""]]
        .filter(([, v]) => v !== undefined && v !== "").map(([k, v]) => `<tr><td class="faint" style="width:140px">${k}</td><td class="muted">${esc(v)}</td></tr>`).join("")}</table></div>`;
}
function engBenchSample() {
  const r = rng(3), N = 32, lab = Array.from({ length: N }, (_, i) => `${Math.floor(i / 2)}:${i % 2 ? "30" : "00"}`);
  const target = i => i < 10 ? i * 40 : i < 26 ? 400 : i < 28 ? 800 : Math.max(0, 400 - (i - 28) * 130);
  const rps = lab.map((_, i) => target(i) * (0.97 + r() * 0.04));
  const vus = lab.map((_, i) => Math.round(target(i) * 1.25 * (0.96 + r() * 0.06)));
  const p50 = lab.map((_, i) => { const t = target(i); return t >= 800 ? 61 + r() * 12 : 11 + t / 400 * 10 + r() * 3; });
  const p95 = lab.map((_, i) => { const t = target(i); return t >= 800 ? 180 + r() * 40 : 24 + t / 400 * 32 + r() * 6; });
  const p99 = lab.map((_, i) => { const t = target(i); return t >= 800 ? 390 + r() * 60 : 52 + t / 400 * 60 + r() * 12; });
  const eps = [["GET /me", "read", "55%", 9, 21, 38], ["POST /p2p", "write", "25%", 14, 38, 71], ["POST /withdrawals", "write + bank", "10%", 22, 57, 112], ["POST /webhooks/sim", "bank event", "10%", 6, 15, 29]];
  const asserts = [["Duplicate payouts", "0", "no transfer was sent to the bank twice"], ["Overdrafts", "0", "nobody spent more than their available balance"], ["Unbalanced journals", "0", "every journal's debits equal its credits"], ["Balances vs the reference model", "0 diffs", "checked account by account after the run"]];
  return `${SAMPLE("Sample numbers: no load test result is in this build yet (bench.json missing).")}
    <div class="grid g4">${[["Peak throughput", "806 req/s", "1-minute spike, no 5xx"], ["Sustained", "400 req/s", "8 minutes at p95 58 ms"], ["Concurrent users", "1,000", "virtual users at peak"], ["Money errors", "0", "duplicates · overdrafts · unbalanced"]]
      .map(([l, v, s], i) => `<div class="card stat ${i === 3 ? "good" : ""}"><div class="lbl">${l}</div><div class="val">${v}</div><div class="sub">${s}</div></div>`).join("")}</div>
    <div class="grid g3">
      <div class="card pad">${lineChart("bt-rps", { title: "Throughput (req/s)", labels: lab, unit: "elapsed", height: 220, width: 360, fmtv: v => v.toFixed(0), series: [{ name: "req/s", color: "var(--s1)", values: rps }] })}</div>
      <div class="card pad">${lineChart("bt-vus", { title: "Concurrent virtual users", labels: lab, unit: "elapsed", height: 220, width: 360, fmtv: v => v.toFixed(0), series: [{ name: "VUs", color: "var(--s2)", values: vus }] })}</div>
      <div class="card pad">${lineChart("bt-lat", { title: "Latency (ms)", labels: lab, unit: "elapsed", height: 220, width: 360, fmtv: v => v.toFixed(0), series: [{ name: "p50", color: "var(--s1)", values: p50 }, { name: "p95", color: "var(--s2)", values: p95 }, { name: "p99", color: "var(--s3)", values: p99 }] })}</div></div>
    <div class="grid g2">
      <div class="card pad"><h2 class="t">By endpoint</h2><table><tr><th>Endpoint</th><th>Share</th><th class="num">p50</th><th class="num">p95</th><th class="num">p99</th></tr>
        ${eps.map(([e, t, s, a, b, c]) => `<tr><td class="mono small">${e}<div class="faint" style="font-family:var(--ui)">${t}</div></td><td>${s}</td><td class="num">${a}</td><td class="num">${b}</td><td class="num">${c}</td></tr>`).join("")}</table></div>
      <div class="card pad"><h2 class="t">Money after the run</h2><p class="muted small" style="margin:0 0 6px">A reference model replays every accepted request; the database must agree with it exactly.</p>
        ${asserts.map(([n, v, d]) => `<div class="check"><span class="ok">✓</span><div style="flex:1"><div>${n}</div><div class="faint small">${d}</div></div><b class="mono">${v}</b></div>`).join("")}</div></div>`;
}
// API reference. "Try it" runs against this demo space and links to the trace it produced.
const lastOf = (kind, pred = () => true) => S.transfers.find(t => t.kind === kind && pred(t));
const ENDPOINTS = [
  { g: "Customer", m: "GET", p: "/me", d: "Balances for the customers in this space: balance, held, on hold, available.", fields: [] },
  { g: "Customer", m: "GET", p: "/transfers", d: "This space's transfers, newest first, with their event names.", fields: [] },
  { g: "Customer", m: "GET", p: "/transfers/{id}", d: "One transfer with its timeline and the journals it posted.", fields: [], path: () => { const t = S.transfers[0]; return t ? `/transfers/${t.id}` : null; } },
  { g: "Customer", m: "POST", p: "/pulls", d: "S2 · Pull money from the linked account. Checks the balance with Plaid, then creates an ACH debit at the bank. The money is restricted until it settles and the hold ends.", idem: true, limited: true, fields: [["amount_minor", "integer", "Cents, > 0"], ["counterparty_name", "string?", "Sandbox: RETURN_UNAUTH makes Column return it (R29)"]], body: () => ({ amount_minor: 50000 }) },
  { g: "Customer", m: "POST", p: "/p2p", d: "S3 · Send money to another customer in the space. Ledger only, one transaction.", idem: true, limited: true, fields: [["to_customer_id", "uuid", "Recipient in the same space"], ["amount_minor", "integer", "Cents, > 0"]], body: () => ({ to_customer_id: alex() ? alex().id : "", amount_minor: 5000 }) },
  { g: "Customer", m: "POST", p: "/withdrawals", d: "S4 · Withdraw to the linked account. A lost bank reply leaves the transfer “unknown” with the money held, never “failed”.", idem: true, limited: true, fields: [["amount_minor", "integer", "Cents, > 0"], ["drill", "string?", "Sandbox only: drop_response | unavailable"]], body: () => ({ amount_minor: 10000, drill: "drop_response" }) },
  { g: "Customer", m: "POST", p: "/transfers/recover-unknown", d: "S4 · Retry every “unknown” transfer with its original Idempotency-Key and book what the bank says.", fields: [] },
  { g: "Demo", m: "POST", p: "/spaces", d: "Claim a pre-funded demo space (two customers, ledger accounts, one bank account) and get its session token.", fields: [], noAuth: true },
  { g: "Demo", m: "POST", p: "/demo/payroll", d: "S1 · Book the payroll credit that landed on this space's bank account.", fields: [["amount_minor", "integer?", "Simulator only; pooled spaces use the real credit"]], body: () => ({}) },
  { g: "Demo", m: "POST", p: "/demo/settle", d: "Demo clock: ask the bank to settle every transfer in flight, then apply what it returns.", fields: [] },
  { g: "Demo", m: "POST", p: "/demo/release-funds", d: "Demo clock: end the hold period for settled pulls.", fields: [] },
  { g: "Ops", m: "GET", p: "/ops/summary", d: "The Operations page: ledger check, bank vs books, the work queue, write-offs, reconciliation.", fields: [] },
  { g: "Ops", m: "POST", p: "/write-offs", d: "S5 · Request a write-off of the customer's negative balance. Needs a second person to approve.", limited: true, fields: [] },
  { g: "Ops", m: "POST", p: "/write-offs/{id}/approve", d: "S5 · Approve as a different person. The database rejects self-approval (CHECK constraint).", fields: [], path: () => { const w = S.ops && S.ops.write_offs.find(w => w.status === "pending"); return w ? `/write-offs/${w.id}/approve` : null; } },
  { g: "Ops", m: "POST", p: "/ops/reconciliation/run", d: "Match every transaction on the bank account to exactly one cash journal; record exceptions.", fields: [] },
  { g: "Ops", m: "POST", p: "/ops/reports", d: "Daily report: read-only facts, drafted by an OpenAI model within a daily budget, or by rules without a key.", fields: [] },
  { g: "Ops", m: "GET", p: "/ledger/trial-balance", d: "Every ledger account and the two invariants.", fields: [] },
  { g: "Platform", m: "GET", p: "/traces/{id}", d: "One trace from this space: spans with service, timing, status and attributes.", fields: [], path: () => S.trace ? `/traces/${S.trace}` : null },
  { g: "Platform", m: "GET", p: "/status", d: "Dependency health now and per-service latency over the last hour. No session needed.", fields: [], noAuth: true },
];
function engApi() {
  const key = e => `${e.m} ${e.p}`;
  const ep = ENDPOINTS.find(e => key(e) === S.api) || ENDPOINTS[0];
  const url = `${location.origin}${BASE.replace(/\/$/, "")}`;
  const body = ep.body && ep.body();
  const curl = `curl -X ${ep.m} ${url}${ep.p}${ep.noAuth ? "" : ` \\\n  -H "Authorization: Bearer $TOKEN"`}${ep.idem ? ` \\\n  -H "Idempotency-Key: $(uuidgen)"` : ""}${body && Object.keys(body).length ? ` \\\n  -H "Content-Type: application/json" \\\n  -d '${JSON.stringify(body)}'` : ""}`;
  const groups = [...new Set(ENDPOINTS.map(e => e.g))];
  const errors = [["401", "Missing or invalid session token", "no"], ["404", "Not found in this space", "no"], ["409", "Conflict (e.g. the bank can't do this in the sandbox)", "no"], ["422", "Validation or business rule (InsufficientFunds, AccountFrozen, key reused with a different body)", "no"], ["429", "Rate limited (Redis token bucket per space)", "yes, after Retry-After"], ["5xx", "Server error", "yes, with the same Idempotency-Key"]];
  return `<div class="card pad"><div class="doc">
      <div class="doc-nav">${groups.map(g => `<div class="grp">${g}</div>${ENDPOINTS.filter(e => e.g === g).map(e => `<button class="${e === ep ? "on" : ""}" onclick="S.api='${key(e)}';S.apiResult=null;S.apiTrace=null;render()"><span class="method ${e.m}">${e.m}</span><span class="mono">${e.p}</span></button>`).join("")}`).join("")}
        <p class="faint small" style="margin:14px 10px 0">${ARCHIVE ? "The OpenAPI docs were generated by the live API from its FastAPI models; they are not part of the archive." : `OpenAPI at <a class="lnk mono" href="${BASE}docs" target="_blank" rel="noopener">docs</a>, generated from the FastAPI models.`}</p></div>
      <div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="method ${ep.m}" style="width:auto;font-size:13px">${ep.m}</span><span class="mono" style="font-size:15px">${ep.p}</span></div>
        <p style="margin:8px 0 0">${ep.d}</p>
        <div class="badges"><span class="chip flat c-grey">Auth: ${ep.noAuth ? "none" : "Bearer token (bound to one space)"}</span>${ep.idem ? `<span class="chip flat c-blue">Idempotency-Key required</span>` : ""}${ep.limited ? `<span class="chip flat c-grey">rate limited per space</span>` : ""}<span class="chip flat c-grey">Money in integer cents</span></div>
        ${ep.fields.length ? `<h3 class="k">Body</h3><table><tr><th>Field</th><th>Type</th><th>Notes</th></tr>${ep.fields.map(([f, t, n]) => `<tr><td class="mono">${f}</td><td class="mono faint">${t}</td><td class="muted">${n}</td></tr>`).join("")}</table>` : ""}
        <h3 class="k">Request</h3><pre class="code">${hl(curl)}</pre>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn sm primary" onclick="act('tryApi')" ${S.busy ? "disabled" : ""}>Try it</button><span class="faint small">Runs against your demo space</span>${S.apiTrace ? `<a class="btn sm ghost" href="javascript:void 0" onclick="pickTrace('${S.apiTrace}')">View its trace →</a>` : ""}</div>
        ${S.apiResult ? `<h3 class="k">Response · ${S.apiResult.status}</h3><pre class="code">${esc(JSON.stringify(S.apiResult.data, null, 2))}</pre>` : ""}</div></div></div>
    <div class="card pad"><h2 class="t">Errors</h2><table><tr><th>Status</th><th>Meaning</th><th>Safe to retry</th></tr>${errors.map(([s, m, r]) => `<tr><td class="mono">${s}</td><td class="muted">${m}</td><td class="small">${r}</td></tr>`).join("")}</table>
      <p class="faint small" style="margin:10px 0 0">Every money-moving POST stores its response under (space, principal, operation, key). A retry gets the same status and body back, including errors.</p></div>`;
}

// ================================================================== interactions
async function act(kind, arg) {
  if (S.busy) return;
  const t = S.transfers, onHome = ["", "app"].includes(route()[0]);
  if (/^s\d$/.test(kind) && !onHome) location.hash = "#/";
  if (kind === "s1") {
    if (t.some(x => x.kind === "payroll")) return toast("Payroll is already in. Try the next step.");
    await run({ tag: "S1", title: "Get paid" }, "POST", "demo/payroll", {});
  } else if (kind === "s2") {
    if (t.some(x => x.kind === "pull" && x.counterparty_name !== "RETURN_UNAUTH" && ["processing", "pending"].includes(x.status))) return toast("A pull is already on its way. Advance the clock.");
    await run({ tag: "S2", title: "Add money" }, "POST", "pulls", { amount_minor: 50000 }, { idem: newKey() });
  } else if (kind === "s3") {
    if (t.some(x => x.kind === "p2p")) return toast("Alex is already paid. Try the next step.");
    await run({ tag: "S3", title: "Pay Alex" }, "POST", "p2p", { to_customer_id: alex().id, amount_minor: 5000 }, { idem: newKey() });
  }
  else if (kind === "s4") {
    // The drill is always on: the bank accepts the transfer but its reply is dropped, which is the point of S4.
    const amount = Math.min(230000, me().available_minor);
    if (amount <= 0) return toast("Nothing available to withdraw.");
    await run({ tag: "S4", title: "Withdraw · drill" }, "POST", "withdrawals", { amount_minor: amount, drill: "drop_response" }, { idem: newKey() });
  }
  else if (kind === "s5") {
    if (isSim()) {
      const pull = t.find(x => x.kind === "pull" && x.status === "settled");
      if (!pull) return toast("Run S2 and advance the clock until it settles first");
      await run({ tag: "S5", title: "Chargeback (R10)", ref: pull.id }, "POST", `demo/transfers/${pull.id}/return`, { return_code: "R10" });
    } else {
      const r = await run({ tag: "S5", title: "Pull, disputed" }, "POST", "pulls", { amount_minor: 50000, counterparty_name: "RETURN_UNAUTH" }, { idem: newKey() });
      if (r && r.status < 300) await run({ tag: "S5", title: "Settles → returned (R29)" }, "POST", "demo/settle");
    }
  } else if (kind === "advance") {
    if (t.some(x => x.status === "processing")) await run({ tag: "Clock", title: "Settle at the bank" }, "POST", "demo/settle");
    else if (t.some(x => x.kind === "pull" && x.status === "settled" && !x.events.includes("funds_available"))) await run({ tag: "Clock", title: "Release holds" }, "POST", "demo/release-funds");
    else toast("Nothing is in flight.");
  } else if (kind === "recover") await run({ tag: "S4", title: "Recovery" }, "POST", "transfers/recover-unknown");
  else if (kind === "requestWriteOff") await run({ tag: "S5", title: "Request write-off" }, "POST", "write-offs");
  else if (kind === "approveWriteOff") await run({ tag: "S5", title: "Approve write-off", ref: arg }, "POST", `write-offs/${arg}/approve`);
  else if (kind === "injectMismatch") { const r = await run({ tag: "Ops", title: "Drill: unbooked debit" }, "POST", "ops/drills/unbooked-bank-debit", { amount_minor: 2500 }); if (r && r.status < 300) toast("$25.00 left the bank account without a journal. Run reconciliation."); }
  else if (kind === "reconcile") await run({ tag: "Ops", title: "Reconciliation" }, "POST", "ops/reconciliation/run");
  else if (kind === "escalate") await run({ tag: "Ops", title: "Escalate" }, "POST", `ops/reconciliation/exceptions/${arg}/escalate`, {});
  else if (kind === "report") { const r = await run({ tag: "Ops", title: "Daily report" }, "POST", "ops/reports"); if (r && r.status < 300) S.report = r.data; }
  else if (kind === "tryApi") {
    const ep = ENDPOINTS.find(e => `${e.m} ${e.p}` === S.api);
    const path = ep.path ? ep.path() : ep.p;
    if (!path) return toast("Nothing to point this at yet. Run a case first.");
    if (ARCHIVE && ep.m !== "GET") { S.apiResult = { status: 410, data: { error: "Archived", message: "In the archive, Try it replays GET requests only." } }; S.apiTrace = null; return render(); }
    const body = ep.body ? ep.body() : ep.m === "POST" ? undefined : undefined;
    let r;
    if (ep.m === "GET") { r = await call("GET", path.slice(1)); }
    else {
      if (ep.p === "/spaces") { r = await call("POST", "spaces"); r.traceId = null; }
      else r = await run({ tag: "API", title: `${ep.m} ${ep.p}` }, ep.m, path.slice(1), body, ep.idem ? { idem: newKey() } : {});
    }
    S.apiResult = { status: r.status, data: r.data }; S.apiTrace = r.traceId || null;
  }
  if (!onHome && S.traces[0] && S.trace === S.traces[0].id && !["tryApi"].includes(kind) && !/^s\d$/.test(kind) && kind !== "injectMismatch")
    toast(`Trace recorded · <a href="javascript:void 0" onclick="pickTrace('${S.trace}')">view it</a>`);
  render();
}
async function openDetail(id) {
  const r = await call("GET", `transfers/${id}`);
  if (r.status !== 200) return toast(errText(r));
  S.detail = r.data; S.sheet = { kind: "detail" };
  if (S.refs[id]) { const tr = S.traces.find(x => x.id === S.refs[id]); if (tr) { S.trace = tr.id; S.span = tr.focus; } }
  render();
}

// ================================================================== background: drifting fern veins
(function veins() {
  const c = document.getElementById("veins"), g = c.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fronds = Array.from({ length: 7 }, (_, i) => ({ x: (i + 0.5) / 7, y: 0.15 + (i % 3) * 0.32, a: -0.9 + (i % 4) * 0.55, len: 0.38 + (i % 3) * 0.12, ph: i * 1.7 }));
  function size() { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; }
  function draw(time) {
    const W = c.width, H = c.height, s = Math.min(W, H);
    g.clearRect(0, 0, W, H); g.lineWidth = devicePixelRatio; g.strokeStyle = "rgba(82,224,138,0.06)";
    for (const f of fronds) {
      let x = f.x * W, y = f.y * H, ang = f.a + (still ? 0 : Math.sin(time / 6000 + f.ph) * 0.05);
      const steps = 26, seg = (f.len * s) / steps;
      for (let i = 0; i < steps; i++) {
        const nx = x + Math.cos(ang) * seg, ny = y + Math.sin(ang) * seg;
        g.beginPath(); g.moveTo(x, y); g.lineTo(nx, ny); g.stroke();
        const leaf = seg * 2.4 * (1 - i / steps);
        for (const side of [-1, 1]) { const la = ang + side * 1.05;
          g.beginPath(); g.moveTo(nx, ny); g.quadraticCurveTo(nx + Math.cos(la) * leaf * .6, ny + Math.sin(la) * leaf * .6, nx + Math.cos(la - side * .35) * leaf, ny + Math.sin(la - side * .35) * leaf); g.stroke(); }
        x = nx; y = ny; ang += 0.045;
      }
    }
    if (!still) requestAnimationFrame(draw);
  }
  addEventListener("resize", size); size(); requestAnimationFrame(draw);
})();

render();
if (location.hash === "#/eng/benchmark") history.replaceState(null, "", "#/bench");
loadArchive().then(() => { if (ARCHIVE) showArchive(); return boot(); }).then(async () => { const [top] = route(); if (["", "eng", "bench"].includes(top)) { await Promise.all([refreshStatus(), refreshBench()]); render(); } });
</script>
