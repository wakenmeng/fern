# Local Postgres and Redis. Port is offset to avoid clashing with a Postgres already on the host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fern
      POSTGRES_PASSWORD: fern
      POSTGRES_DB: fern
    ports:
      - "54329:5432"
    volumes:
      - ./infra/local/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fern"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Rate limits only; no money state lives here.
  redis:
    image: redis:7
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
